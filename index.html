ds.join(' ')}] /Count ${n} >>\\nendobj\\n`);\n\n  canvases.forEach((c, i) => {\n    const pageId = 3 + i * 3, contId = pageId + 1, imgId = pageId + 2;\n    const b64 = c.toDataURL('image/jpeg', 0.92).split(',')[1];\n    const bin = atob(b64);\n    const jpg = new Uint8Array(bin.length);\n    for (let k = 0; k < bin.length; k++) jpg[k] = bin.charCodeAt(k);\n\n    startObj(pageId);\n    push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PWpt} ${PHpt}] /Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${contId} 0 R >>\\nendobj\\n`);\n    const content = `q ${PWpt} 0 0 ${PHpt} 0 0 cm /Im0 Do Q`;\n    startObj(contId);\n    push(`<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream\\nendobj\\n`);\n    startObj(imgId);\n    push(`<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\\nstream\\n`);\n    push(jpg);\n    push('\\nendstream\\nendobj\\n');\n  });\n\n  const total = 3 + n * 3;\n  const xrefPos = pos;\n  let xref = `xref\\n0 ${total}\\n0000000000 65535 f \\n`;\n  for (let id = 1; id < total; id++) xref += String(offsets[id]).padStart(10, '0') + ' 00000 n \\n';\n  push(xref);\n  push(`trailer\\n<< /Size ${total} /Root 1 0 R >>\\nstartxref\\n${xrefPos}\\n%%EOF`);\n  return new Blob(chunks, { type: 'application/pdf' });\n}\n\nfunction closePreview() { document.getElementById('preview-overlay').style.display = 'none'; }\n\nfunction flipAllCards(shouldHideText) {\n  const cards = document.querySelectorAll('.flashcard');\n  cards.forEach(card => {\n    if (shouldHideText) {\n      card.classList.add('flipped');\n    } else {\n      card.classList.remove('flipped');\n    }\n  });\n}\n\ndocument.addEventListener('keydown', e => {\n  if (document.getElementById('admin-page').classList.contains('active')) return;\n  if (game.running && isHitPaused) {\n    e.preventDefault();\n    const k = e.key.toLowerCase();\n    if (k === 'y' || k === 'enter') judgeSign(true);\n    else if (k === 'n' || k === 'escape') judgeSign(false);\n    return;\n  }\n  if (e.key === ' ' && game.running && !cfg.paused) {\n    if (!e.repeat) fireAtMouse();\n    e.preventDefault();\n    return;\n  }\n  keys[e.key] = true;\n  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();\n});\ndocument.addEventListener('keyup', e => { keys[e.key] = false; });\n\nlet mouseX = null, mouseY = null;\ncv.addEventListener('mousemove', e => {\n  const r = cv.getBoundingClientRect();\n  mouseX = (e.clientX - r.left) * (W / r.width);\n  mouseY = (e.clientY - r.top) * (H / r.height);\n});\nfunction fireAtMouse() {\n  if (mouseX === null) { fireDart(monkey.x + monkey.facing*56, -100); return; } // 尚未移動滑鼠：朝正上方\n  let tx = mouseX, ty = mouseY;\n  for (const b of balloons) { // 滑鼠停在氣球上：直接瞄準氣球中心\n    if (!b.pop && Math.hypot(mouseX - b.x, mouseY - b.y) < b.r + 10) { tx = b.x; ty = b.y; break; }\n  }\n  fireDart(tx, ty);\n}\n\ncv.addEventListener('mousedown', e => {\n  if (!game.running) return;\n  if (isHitPaused) { e.preventDefault(); return; }\n  if (cfg.paused) return; \n  const r = cv.getBoundingClientRect();\n  fireDart((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));\n});\n\nfunction rnd(a,b) { return Math.random()*(b-a)+a; }\n\nfunction startGame() {\n  if (team.on && (!team.started || team.finished)) { startTeamMatch(); return; } // 組別對抗：先進入對抗賽流程\n  pendingHit = null;\n  team.recorded = false;\n  resize(); // 核心修正：啟動時強制重新測量畫布大小，避免抓到 0x0 寬高\n  \n  monkey.x = W/2; monkey.y = H - 65; monkey.arm = 0; monkey.shootT = 0;\n  balloons=[]; darts=[]; particles=[]; floats=[];\n  game.score=0; game.combo=0; game.comboT=0;\n  game.lives = cfg.maxLives; game.timeLeft = cfg.timeLimit; game.spawnAcc=0;\n  game.running=true; game.over=false; cfg.paused = false; isHitPaused = false;\n  \n  if(!isWeaknessMode) { currentSessionMissed.clear(); }\n  \n  document.getElementById('live-learning-box').style.display = 'none';\n  document.getElementById('sc-el').textContent = '0';\n  document.getElementById('tm-el').textContent = game.timeLeft;\n  document.getElementById('combo-el').style.display = 'none';\n  document.getElementById('ov').style.display = 'none';\n  document.getElementById('pp-btn').textContent = '⏸ 暫停';\n  updLives();\n  updateTeamBoard();\n  \n  clearInterval(tickInt);\n  tickInt = setInterval(() => {\n    if (!game.running || cfg.paused || isHitPaused) return; \n    game.timeLeft--;\n    document.getElementById('tm-el').textContent = game.timeLeft;\n    if (game.timeLeft <= 0) endGame();\n  }, 1000);\n  \n  if (raf) cancelAnimationFrame(raf);\n  let last = performance.now();\n  \n  function loop(ts) {\n    if (!game.running) return;\n    const dt = Math.min((ts - last) / 16.67, 3);\n    last = ts;\n    if (!cfg.paused && !isHitPaused) update(dt); \n    draw();\n    raf = requestAnimationFrame(loop);\n  }\n  raf = requestAnimationFrame(loop);\n}\n\nfunction endGame() {\n  if (game.over) return; // 避免同一幀重複結算\n  game.running = false; game.over = true;\n  clearInterval(tickInt); stats.games++;\n  if (game.score > stats.hi) stats.hi = game.score;\n  saveToLocalStorage();\n  updStats();\n  \n  const ov = document.getElementById('ov');\n  let reviewHtml = '';\n  \n  if(currentSessionMissed.size > 0) {\n    const missedDetails = ALL_WORDS.filter(w => currentSessionMissed.has(w.word));\n    reviewHtml = `\n      <div class=\"review-container\">\n        <div class=\"review-title\">⚠️ 本局漏掉或打錯的手語詞彙：<\/div>\n        <div class=\"review-list\">\n          ${missedDetails.map(w => `${w.emoji} <b>${w.word}<\/b>`).join(' &nbsp;|&nbsp; ')}\n        <\/div>\n      <\/div>\n      <button class=\"gbtn\" style=\"background:#FF6B6B; color:#fff; font-size:15px; padding:10px 24px; margin-bottom:10px;\" onclick=\"startWeakness特訓()\">🎯 開啟【弱點加強特訓關卡】<\/button>\n    `;\n  } else {\n    reviewHtml = `<p style=\"color:#4CAF50; font-weight:700; margin:15px 0;\">🎉 太完美了！每個手語都打對了！<\/p>`;\n  }\n\n  ov.innerHTML = `\n    <h1>遊戲結束！<\/h1>\n    <div class=\"fscore\">${game.score}<\/div>\n    <div class=\"flab\">分<\/div>\n    <p style=\"color:#888;font-size:13px\">最高紀錄：${stats.hi} 分<\/p>\n    ${reviewHtml}\n    <div style=\"margin-top:10px;\">\n      <button class=\"gbtn preview-btn\" onclick=\"openPreview()\">🃏 預習本次詞彙<\/button>\n      <button class=\"gbtn\" onclick=\"isWeaknessMode=false;startGame()\">重新正常開局<\/button>\n    <\/div>\n  `;\n  ov.style.display = 'flex';\n  document.getElementById('live-learning-box').style.display = 'none';\n  if (recordTeamScore()) showTeamResult(); // 組別對抗：記分並顯示該組成績\n}\n\nfunction startWeakness特訓() {\n  isWeaknessMode = true;\n  addLog('sys', `⚡ 啟動弱點特訓！本局將只會出現剛才漏掉的 ${currentSessionMissed.size} 個生字。`);\n  startGame();\n}\n\nfunction togglePause() { \n  if (!game.running || isHitPaused) return; \n  cfg.paused = !cfg.paused;\n  document.getElementById('pp-btn').textContent = cfg.paused ? '▶ 繼續' : '⏸ 暫停';\n  addLog('sys', cfg.paused ? '遊戲已暫停' : '遊戲已恢復');\n}\n\nfunction panelReset() {\n  if (raf) cancelAnimationFrame(raf);\n  clearInterval(tickInt); game.running = false; isHitPaused = false;\n  document.getElementById('live-learning-box').style.display = 'none';\n  document.getElementById('preview-overlay').style.display = 'none';\n  const ov = document.getElementById('ov');\n  ov.innerHTML = `\n    <h1>🐒 猴子射氣球<\/h1>\n    <p class=\"sub\">射中氣球，學習手語！<\/p>\n    <p style=\"color:#666;font-size:12px;margin-bottom:20px\">W / S / A / D 或 方向鍵 移動猴子 &nbsp;|&nbsp; 滑鼠點擊射飛鏢<\/p>\n    <div>\n      <button class=\"gbtn preview-btn\" onclick=\"openPreview()\">🃏 預習本次詞彙<\/button>\n      <button class=\"gbtn\" id=\"main-btn\" onclick=\"isWeaknessMode=false; startGame();\">直接開始遊戲<\/button>\n    <\/div>\n  `;\n  ov.style.display = 'flex';\n  addLog('sys', '遊戲已重置');\n  if (team.on && team.started && !team.finished) {\n    if (team.recorded) { team.idx++; team.recorded = false; } // 該組成績已記錄，重置視為換下一組\n    showTeamIntro();\n  }\n  updateTeamBoard();\n}\n\nfunction updLives() {\n  const heartString = '❤'.repeat(Math.max(0, game.lives));\n  document.getElementById('lives-el').textContent = heartString || '💀';\n}\n\nfunction fireDart(tx, ty) {\n  const ox = monkey.x + monkey.facing*56, oy = monkey.y - 56;\n  const dx = tx-ox, dy = ty-oy, len = Math.sqrt(dx*dx+dy*dy)||1;\n  darts.push({x:ox,y:oy,vx:dx/len*20,vy:dy/len*20,trail:[],hit:false});\n  if(dx!==0) monkey.facing = dx>0?1:-1; monkey.shootT = 18;\n}\n\nfunction spawnBalloon() {\n  const ws = getWords();\n  if (!ws.length) return;\n  const wd = ws[Math.floor(rnd(0,ws.length))];\n  const r = Math.floor(rnd(24,40));\n  const spd = rnd(0.65,1.7)*cfg.spd;\n  const COLS = ['#FF5B5B','#FF9F1C','#FFDE3D','#4BC97A','#5B9FFF','#C47BFF','#FF80C8','#FFB347'];\n  balloons.push({x:rnd(r+15,W-r-15),y:H+r+10,r,color:COLS[Math.floor(rnd(0,COLS.length))],vy:-spd,vx:rnd(-0.5,0.5),wobble:rnd(0,Math.PI*2),word:wd,pop:false,popT:0,escaped:false});\n}\n\nfunction spawnParts(x,y,color) {\n  for(let i=0;i<18;i++){const a=rnd(0,Math.PI*2),s=rnd(3,8);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1,r:rnd(3,9)});}\n}\n\nconst MISS_PENALTY = 5; // 沒射中氣球／少一顆心 各扣的分數\nfunction penalizeScore(x, y, reason) {\n  if (!game.running) return;\n  const before = game.score;\n  game.score = Math.max(0, game.score - MISS_PENALTY);\n  const lost = before - game.score;\n  document.getElementById('sc-el').textContent = game.score;\n  if (lost > 0) {\n    addFloat(x, y, '-' + lost + '分', '#FF6B6B');\n    addLog('esc', `${reason} -${lost}分`);\n  }\n}\nfunction addFloat(x,y,t,c) { floats.push({x,y,text:t,color:c||'#fff',life:1}); }\n\nfunction showLiveLearning(wd) {\n  const box = document.getElementById('live-learning-box');\n  if(!box) return;\n  document.getElementById('ll-em').textContent = wd.emoji;\n  document.getElementById('ll-wd').textContent = wd.word;\n  box.style.display = 'block';\n  isHitPaused = true; \n}\n\nlet pendingHit = null;\nfunction judgeSign(correct) {\n  if (!isHitPaused || !pendingHit) return;\n  const { word, x, y } = pendingHit;\n  pendingHit = null;\n  if (correct) {\n    game.combo = Math.min(game.combo + 1, 12); game.comboT = 140;\n    const pts = word.points * game.combo;\n    game.score += pts;\n    document.getElementById('sc-el').textContent = game.score;\n    const ce = document.getElementById('combo-el');\n    ce.textContent = 'x' + game.combo; ce.style.display = game.combo > 1 ? 'block' : 'none';\n    addFloat(x, y, (game.combo > 1 ? `×${game.combo} ` : '') + '+' + pts, game.combo > 4 ? '#FFD700' : '#fff');\n    if (isWeaknessMode && currentSessionMissed.has(word.word)) currentSessionMissed.delete(word.word);\n    addLog('hit', `「${word.word}」${word.emoji} 手語正確 +${pts}分${game.combo > 1 ? ' 連擊×' + game.combo : ''}`);\n  } else {\n    game.combo = 0; game.comboT = 0;\n    document.getElementById('combo-el').style.display = 'none';\n    addFloat(x, y, '手語打錯 +0', '#FF6B6B');\n    currentSessionMissed.add(word.word);\n    addLog('esc', `「${word.word}」手語打錯，本題不加分`);\n  }\n  resumeFromHit();\n}\n\nfunction resumeFromHit() {\n  isHitPaused = false; \n  document.getElementById('live-learning-box').style.display = 'none';\n  for (let key in keys) { keys[key] = false; }\n}\n\nfunction update(dt) {\n  const ml=keys['ArrowLeft']||keys['a']||keys['A'];\n  const mr=keys['ArrowRight']||keys['d']||keys['D'];\n  const mu=keys['ArrowUp']||keys['w']||keys['W'];\n  const md=keys['ArrowDown']||keys['s']||keys['S'];\n  if(ml){monkey.x-=monkey.speed*dt;monkey.facing=-1;}\n  if(mr){monkey.x+=monkey.speed*dt;monkey.facing=1;}\n  if(mu){monkey.y-=monkey.speed*dt;}\n  if(md){monkey.y+=monkey.speed*dt;}\n  monkey.x=Math.max(40,Math.min(W-40,monkey.x));\n  monkey.y=Math.max(100,Math.min(H-65,monkey.y));\n  if(ml||mr||mu||md){monkey.arm+=0.13*dt*monkey.armDir;if(Math.abs(monkey.arm)>.35)monkey.armDir*=-1;}\n  else monkey.arm*=.88;\n  if(monkey.shootT>0)monkey.shootT-=dt;\n  if(game.comboT>0){game.comboT-=dt;if(game.comboT<=0){game.combo=0;document.getElementById('combo-el').style.display='none';}}\n  game.spawnAcc+=dt;\n  const sr=Math.max(12, (60/cfg.balloonsPerSecond)*(cfg.spawnRate/55)-(cfg.timeLimit-game.timeLeft)*.5);\n  if(game.spawnAcc>sr){spawnBalloon();game.spawnAcc=0;}\n  darts.forEach(d=>{d.trail.push({x:d.x,y:d.y});if(d.trail.length>9)d.trail.shift();d.x+=d.vx*dt;d.y+=d.vy*dt;});\n  darts.forEach(d=>{\n    if(!d.hit&&!d.missed&&(d.y<=-40||d.y>=H+40||d.x<=-40||d.x>=W+40)){\n      d.missed=true;\n      game.lives--;updLives();\n      addFloat(Math.max(30,Math.min(W-30,d.x)),Math.max(40,Math.min(H-40,d.y)),'-1 ❤','#FF6B6B');\n      addLog('esc',`飛鏢落空，剩餘 ${game.lives} 命`);\n      if(game.lives<=0&&game.running)endGame();\n    }\n  });\n  darts=darts.filter(d=>!d.hit&&!d.missed);\n  balloons.forEach(b=>{\n    if(b.pop) { b.popT+=dt; return; }\n    b.y+=b.vy*dt;b.x+=b.vx*dt;b.wobble+=.05*dt;\n    if(b.x<b.r||b.x>W-b.r)b.vx*=-1;\n    if(!b.escaped&&b.y<-b.r-10){\n      b.escaped=true;game.lives--;updLives();\n      addFloat(b.x,30,'-1 ❤','#FF6B6B');\n      stats.esc++; \n      currentSessionMissed.add(b.word.word);\n      updStats();\n      addLog('esc', `「${b.word.word}」氣球逃脫，剩餘 ${game.lives} 命`);\n      if(game.lives<=0)endGame();\n    }\n    darts.forEach(d=>{\n      if(d.hit||b.pop)return;\n      if(b.y < H * 0.74 && Math.hypot(d.x-b.x,d.y-b.y)<b.r+4){\n        b.pop=true;d.hit=true;\n        spawnParts(b.x,b.y,b.color);\n        pendingHit={word:b.word,x:b.x,y:b.y-b.r-8};\n        showLiveLearning(b.word);\n        stats.hits++;updStats();\n        addLog('hit',`擊中「${b.word.word}」${b.word.emoji}，等待打手語判定…`);\n      }\n    });\n  });\n  balloons=balloons.filter(b=>!b.escaped&&(!b.pop||b.popT<16));\n  particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=.045*dt;});\n  particles=particles.filter(p=>p.life>0);\n  floats.forEach(f=>{f.y-=1.5*dt;f.life-=.028*dt;});\n  floats=floats.filter(f=>f.life>0);\n}\n\nfunction draw() {\n  if(!W||!H)return;\n  ctx.clearRect(0,0,W,H);\n  drawBG();drawBalloons();drawDarts();drawMonkey();drawParts();drawFloats();\n  if(isHitPaused && game.running){\n    ctx.fillStyle='rgba(8,6,30,.4)';ctx.fillRect(0,0,W,H);\n    ctx.fillStyle='#FFD700';ctx.font='900 24px Nunito,sans-serif';ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=4;ctx.textAlign='center';ctx.textBaseline='middle';\n    ctx.fillText('✨ 請打出氣球上的手語 ✨',W/2,H/2 - 20);\n    ctx.fillStyle='#FFF';ctx.font='700 16px Nunito,sans-serif';\n    ctx.fillText('打對請按 Y，打錯請按 N（或點右側按鈕）',W/2,H/2 + 20);\n    ctx.shadowBlur=0; \n  }\n  else if(cfg.paused && game.running){\n    ctx.fillStyle='rgba(8,6,30,.55)';ctx.fillRect(0,0,W,H);\n    ctx.fillStyle='#FFD700';ctx.font='900 38px Nunito,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';\n    ctx.fillText('⏸ 暫停中',W/2,H/2);\n  }\n}\nfunction drawBG(){\n  ctx.fillStyle='#0f0c29';ctx.fillRect(0,0,W,H*.74);\n  ctx.fillStyle='rgba(255,255,255,.55)';\n  [[.07,.09],[.18,.04],[.38,.12],[.55,.03],[.72,.09],[.88,.05],[.95,.14],[.04,.18],[.28,.07],[.62,.16],[.83,.11]].forEach(([fx,fy])=>{ctx.beginPath();ctx.arc(fx*W,fy*H,1.3,0,Math.PI*2);ctx.fill();});\n  ctx.fillStyle='#FFF9C4';ctx.beginPath();ctx.arc(W*.9,H*.1,20,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#0f0c29';ctx.beginPath();ctx.arc(W*.9+8,H*.1-6,16,0,Math.PI*2);ctx.fill();\n  [[.12,.2,.7],[.45,.15,.9],[.78,.22,.65]].forEach(([fx,fy,s])=>drawCloud(fx*W,fy*H,s));\n  ctx.fillStyle='#2d5a1b';ctx.fillRect(0,H*.74,W,H*.26);\n  ctx.fillStyle='#3a7023';ctx.fillRect(0,H*.74,W,16);\n  ctx.fillStyle='#245218';ctx.fillRect(0,H-20,W,20);\n  [.07,.15,.82,.9].forEach((fx,i)=>drawTree(fx*W,H*.74+2,42+i%2*10));\n  ctx.fillStyle='#8B6914';ctx.fillRect(W/2-46,H-23,92,11);\n  ctx.fillStyle='#6B4F0D';ctx.fillRect(W/2-42,H-12,84,6);\n}\nfunction drawCloud(x,y,s){\n  ctx.fillStyle='rgba(255,255,255,.1)';\n  ctx.beginPath();ctx.arc(x,y,28*s,0,Math.PI*2);ctx.arc(x+26*s,y-7*s,20*s,0,Math.PI*2);ctx.arc(x-20*s,y-4*s,17*s,0,Math.PI*2);ctx.fill();\n}\nfunction drawTree(x,base,sz){\n  ctx.fillStyle='#5D4037';ctx.fillRect(x-5,base-sz*.45,10,sz*.45);\n  ctx.fillStyle='#2E7D32';ctx.beginPath();ctx.moveTo(x,base-sz*1.6);ctx.lineTo(x-sz*.6,base-sz*.35);ctx.lineTo(x+sz*.6,base-sz*.35);ctx.closePath();ctx.fill();\n  ctx.fillStyle='#388E3C';ctx.beginPath();ctx.moveTo(x,base-sz*2.0);ctx.lineTo(x-sz*.45,base-sz*.85);ctx.lineTo(x+sz*.45,base-sz*.85);ctx.closePath();ctx.fill();\n}\nfunction drawMonkey(){\n  const mx=monkey.x,my=monkey.y,f=monkey.facing,sh=monkey.shootT>0;\n  ctx.save();ctx.translate(mx,my); ctx.scale(2, 2);\n  \n  ctx.strokeStyle='#a67c52';ctx.lineWidth=5;ctx.lineCap='round';\n  ctx.beginPath();ctx.moveTo(14*f,10);ctx.bezierCurveTo(36*f,2,42*f,20,32*f,30);ctx.stroke();\n  \n  const ls=monkey.arm*.5;\n  ctx.fillStyle='#a67c52';\n  ctx.beginPath();ctx.ellipse(-8+ls*6,14,6,14,ls*.2,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.ellipse(8-ls*6,14,6,14,-ls*.2,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#8b5e3c';\n  ctx.beginPath();ctx.ellipse(-8+ls*4,24,7,6,0,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.ellipse(8-ls*4,24,7,6,0,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='#a67c52';ctx.beginPath();ctx.roundRect(-16,-10,32,26,12);ctx.fill();\n  ctx.fillStyle='#fce5cd';ctx.beginPath();ctx.ellipse(0,1,11,10,0,0,Math.PI*2);ctx.fill();\n  \n  ctx.save();ctx.translate(-16*f,2);ctx.rotate(monkey.arm*.4+.5*f);\n  ctx.fillStyle='#a67c52';ctx.beginPath();ctx.ellipse(0,0,6,13,0,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#fce5cd';ctx.beginPath();ctx.arc(0,12,5,0,Math.PI*2);ctx.fill();\n  ctx.restore();\n  \n  ctx.save();ctx.translate(16*f,2);ctx.rotate(sh?-1.2*f:-.3*f);\n  ctx.fillStyle='#a67c52';ctx.beginPath();ctx.ellipse(0,0,6,13,0,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#fce5cd';ctx.beginPath();ctx.arc(0,12,5,0,Math.PI*2);ctx.fill();\n  \n  ctx.save();ctx.translate(0,12);ctx.scale(f,1);\n  ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.roundRect(-4,-5,24,10,4);ctx.fill();\n  ctx.fillStyle='#FFD700';ctx.beginPath();ctx.roundRect(-2,-8,9,5,2);ctx.fill();\n  ctx.fillStyle='#5B9FFF';ctx.beginPath();ctx.arc(18,0,6,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(18,0,2.5,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.roundRect(-2,3,6,8,2);ctx.fill();\n  if(sh){ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(18,0,10,0,Math.PI*2);ctx.fill();}\n  ctx.restore();\n  ctx.restore();\n  \n  ctx.fillStyle='#a67c52';ctx.beginPath();ctx.arc(0,-24,21,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='#fce5cd';\n  ctx.beginPath();ctx.ellipse(-7,-25,9,9,0,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.ellipse(7,-25,9,9,0,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.ellipse(0,-20,13,10,0,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='#a67c52';\n  ctx.beginPath();ctx.arc(-22,-25,8,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(22,-25,8,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#fce5cd';\n  ctx.beginPath();ctx.arc(-21,-25,5,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(21,-25,5,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='rgba(255,135,135,0.6)';\n  ctx.beginPath();ctx.arc(-11,-20,3.5,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(11,-20,3.5,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='#fff';\n  ctx.beginPath();ctx.arc(-7*f,-25,4.5,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(7*f,-25,4.5,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#2f1f17';\n  ctx.beginPath();ctx.arc(-7*f,-25,3,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(7*f,-25,3,0,Math.PI*2);ctx.fill();\n  ctx.fillStyle='#fff';\n  ctx.beginPath();ctx.arc(-8*f,-26,1.2,0,Math.PI*2);ctx.fill();\n  ctx.beginPath();ctx.arc(6*f,-26,1.2,0,Math.PI*2);ctx.fill();\n  \n  ctx.fillStyle='#b68a6b';\n  ctx.beginPath();ctx.ellipse(0,-21,1.5,1,0,0,Math.PI*2);ctx.fill();\n  ctx.strokeStyle='#7a4f31';ctx.lineWidth=1.5;ctx.lineCap='round';\n  ctx.beginPath();ctx.arc(0,-18,4,0.1,Math.PI-0.1);ctx.stroke();\n  \n  ctx.fillStyle='#1e40af';ctx.beginPath();ctx.ellipse(0,-42,16,5,0,0,Math.PI*2);ctx.fill();\n  ctx.fillRect(-10,-58,20,18);\n  ctx.fillStyle='#FFD700';ctx.fillRect(-10,-44,20,3);\n  \n  ctx.restore();\n}\nfunction drawBalloons(){\n  balloons.forEach(b=>{\n    if(b.pop)return;\n    const w=Math.sin(b.wobble)*2.5;\n    ctx.save();ctx.translate(b.x,b.y);\n    ctx.fillStyle=b.color;ctx.beginPath();ctx.ellipse(w,0,b.r*.84,b.r,0,0,Math.PI*2);ctx.fill();\n    ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(w-b.r*.28,-b.r*.32,b.r*.2,b.r*.32,-.4,0,Math.PI*2);ctx.fill();\n    if (showBalloonText) {\n      ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.roundRect(w-b.r*.72,b.r*.18,b.r*1.44,b.r*.68,4);ctx.fill();\n      ctx.fillStyle='#fff';ctx.font=`900 ${Math.floor(b.r*.44)}px Nunito,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';\n      ctx.fillText(b.word.word,w,b.r*.52);\n    } else {\n      ctx.fillStyle='rgba(255,255,255,.75)';ctx.font=`900 ${Math.floor(b.r*.75)}px 'Nunito', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';\n      ctx.fillText('?',w,-b.r*.05);\n    }\n    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;\n    ctx.beginPath();ctx.moveTo(w,b.r);ctx.bezierCurveTo(w+10,b.r+12,w-8,b.r+24,w,b.r+34);ctx.stroke();\n    ctx.restore();\n  });\n}\nfunction drawDarts(){\n  darts.forEach(d=>{\n    if(d.hit)return;\n    ctx.save();ctx.translate(d.x,d.y);\n    d.trail.forEach((p,i)=>{const t=(i+1)/d.trail.length;ctx.globalAlpha=t*.3;ctx.fillStyle='#5B9FFF';ctx.beginPath();ctx.arc(p.x-d.x,p.y-d.y,3*t,0,Math.PI*2);ctx.fill();});\n    ctx.globalAlpha=1;\n    ctx.fillStyle='rgba(91,159,255,.35)';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();\n    ctx.fillStyle='#5B9FFF';ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fill();\n    ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(-1.5,-1.5,1.8,0,Math.PI*2);ctx.fill();\n    ctx.restore();\n  });\n}\nfunction drawParts(){ particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life*.9);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();}); }\nfunction drawFloats(){ floats.forEach(f=>{ctx.save();ctx.globalAlpha=Math.min(1,f.life*1.5);ctx.fillStyle=f.color;ctx.font=`900 ${f.color==='#FFD700'?19:15}px Nunito,sans-serif`;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.restore();}); }\n\n// ══════════════ 🏆 組別對抗（各組輪流上場，累計總分）══════════════\nconst TEAM_KEY = 'sf_team_cfg';\nconst TEAM_COLORS = ['#FF5B5B','#5B9FFF','#4BC97A','#FFB347','#C47BFF','#FF80C8','#2EC4B6','#FFDE3D'];\nconst team = { on:false, n:3, rounds:1, names:[], members:[], rs:[], turns:[], idx:0, started:false, finished:false, recorded:false };\n(function loadTeamCfg() {\n  try {\n    const c = JSON.parse(localStorage.getItem(TEAM_KEY) || 'null');\n    if (c) { team.on = !!c.on; team.n = Math.min(12, Math.max(2, c.n || 3)); team.rounds = Math.min(5, Math.max(1, c.rounds || 1)); team.names = c.names || []; team.members = c.members || []; }\n  } catch(e) {}\n})();\nfunction teamEsc(s) { return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction teamName(i) { return (team.names[i] && team.names[i].trim()) || ('第' + (i + 1) + '組'); }\nfunction teamTotal(i) { return team.rs[i] ? team.rs[i].reduce((a, b) => a + b, 0) : 0; }\nfunction saveTeamCfg() { try { localStorage.setItem(TEAM_KEY, JSON.stringify({ on:team.on, n:team.n, rounds:team.rounds, names:team.names, members:team.members })); } catch(e) {} }\nfunction teamLocked() { return team.on && team.started && !team.finished; }\n\nfunction renderTeamConfig() {\n  document.getElementById('team-mode-cb').checked = team.on;\n  document.getElementById('team-config').style.display = team.on ? 'block' : 'none';\n  document.getElementById('team-n-sl').value = team.n;\n  document.getElementById('team-n-val').textContent = team.n + ' 組';\n  document.getElementById('team-r-sl').value = team.rounds;\n  document.getElementById('team-r-val').textContent = team.rounds + ' 局';\n  document.getElementById('team-room-in').value = localStorage.getItem('sf_team_room') || '';\n  if (window.__BUS) { document.getElementById('team-room-in').style.display = 'none'; document.getElementById('team-room-lb').style.display = 'none'; }\n  const box = document.getElementById('team-names');\n  box.innerHTML = '';\n  for (let i = 0; i < team.n; i++) {\n    const inp = document.createElement('input');\n    inp.type = 'text'; inp.value = team.names[i] || ''; inp.placeholder = '第' + (i + 1) + '組' + ((team.members[i] && team.members[i].length) ? '（' + team.members[i].length + ' 人）' : '');\n    inp.style.borderLeft = '4px solid ' + TEAM_COLORS[i % 8];\n    inp.oninput = () => { team.names[i] = inp.value; saveTeamCfg(); updateTeamBoard(); };\n    box.appendChild(inp);\n  }\n}\nfunction updateTeamN(v) {\n  if (teamLocked()) { addLog('sys', '對抗賽進行中，請先「重設對抗賽」再調整組數'); renderTeamConfig(); return; }\n  team.n = parseInt(v); saveTeamCfg(); renderTeamConfig();\n}\nfunction updateTeamR(v) {\n  if (teamLocked()) { addLog('sys', '對抗賽進行中，請先「重設對抗賽」再調整局數'); renderTeamConfig(); return; }\n  team.rounds = parseInt(v); saveTeamCfg(); renderTeamConfig();\n}\nfunction toggleTeamMode() {\n  team.on = document.getElementById('team-mode-cb').checked;\n  if (!team.on) { team.started = false; team.finished = false; team.recorded = false; }\n  saveTeamCfg(); renderTeamConfig(); updateTeamBoard();\n  addLog('sys', team.on ? '🏆 已啟用組別對抗，按「開始對抗賽」或「直接開始遊戲」即可' : '已切回個人模式');\n}\n\nfunction stopRunningGame() {\n  if (raf) cancelAnimationFrame(raf);\n  clearInterval(tickInt);\n  game.running = false; isHitPaused = false; pendingHit = null;\n  document.getElementById('live-learning-box').style.display = 'none';\n}\nfunction startTeamMatch() {\n  if (!team.on) { document.getElementById('team-mode-cb').checked = true; team.on = true; saveTeamCfg(); renderTeamConfig(); }\n  stopRunningGame();\n  document.getElementById('preview-overlay').style.display = 'none';\n  team.rs = Array.from({ length: team.n }, () => []);\n  team.turns = [];\n  for (let r = 0; r < team.rounds; r++) for (let t = 0; t < team.n; t++) team.turns.push({ t, r });\n  team.idx = 0; team.started = true; team.finished = false; team.recorded = false;\n  addLog('sys', `🏁 對抗賽開始：${team.n} 組 × ${team.rounds} 局，共 ${team.turns.length} 場`);\n  showTeamIntro();\n}\nfunction resetTeamMatch(toMenu) {\n  stopRunningGame();\n  team.started = false; team.finished = false; team.recorded = false; team.rs = []; team.turns = []; team.idx = 0;\n  updateTeamBoard();\n  if (toMenu) panelReset();\n}\n\nfunction teamBoardHtml(hi, showRank) {\n  let order = [...Array(team.n).keys()];\n  if (showRank) order.sort((a, b) => teamTotal(b) - teamTotal(a));\n  const multi = team.rounds > 1;\n  let prevScore = null, prevRank = 0;\n  const rows = order.map((i, pos) => {\n    let rankCell = '';\n    if (showRank) {\n      const sc = teamTotal(i);\n      const rank = (sc === prevScore) ? prevRank : pos + 1;\n      prevScore = sc; prevRank = rank;\n      rankCell = `<td>${['🥇','🥈','🥉'][rank - 1] || rank}<\/td>`;\n    }\n    const per = multi ? Array.from({ length: team.rounds }, (_, r) => `<td>${team.rs[i] && team.rs[i][r] !== undefined ? team.rs[i][r] : '—'}<\/td>`).join('') : '';\n    return `<tr class=\"${i === hi ? 'cur' : ''}\">${rankCell}<td class=\"nm\"><span class=\"tdot\" style=\"background:${TEAM_COLORS[i % 8]}\"><\/span> ${teamEsc(teamName(i))}<\/td>${per}<td class=\"tot\">${teamTotal(i)}<\/td><\/tr>`;\n  }).join('');\n  const head = `<tr>${showRank ? '<th>名次<\/th>' : ''}<th style=\"text-align:left\">組別<\/th>${multi ? Array.from({ length: team.rounds }, (_, r) => `<th>第${r + 1}局<\/th>`).join('') : ''}<th>總分<\/th><\/tr>`;\n  return `<div class=\"tb-wrap\"><table class=\"tb\">${head}${rows}<\/table><\/div>`;\n}\n\nfunction showTeamIntro() {\n  const cur = team.turns[team.idx];\n  const ov = document.getElementById('ov');\n  ov.innerHTML = `\n    <p class=\"sub\" style=\"margin-bottom:6px\">第 ${cur.r + 1} / ${team.rounds} 輪 ・ 第 ${team.idx + 1} / ${team.turns.length} 場<\/p>\n    <h1 style=\"color:${TEAM_COLORS[cur.t % 8]};font-size:36px;text-align:center\">🏆 輪到「${teamEsc(teamName(cur.t))}」上場！<\/h1>\n    <p class=\"sub\" style=\"margin-bottom:8px\">準備好就開始，全組一起加油！<\/p>\n    ${teamMembersHtml(cur.t)}\n    ${teamBoardHtml(cur.t, false)}\n    <div style=\"margin-top:10px\">\n      <button class=\"gbtn preview-btn\" onclick=\"openPreview()\">🃏 預習本次詞彙<\/button>\n      <button class=\"gbtn\" onclick=\"isWeaknessMode=false; startGame();\">🚀 開始上場<\/button>\n    <\/div>\n    <button class=\"hbtn\" style=\"margin-top:14px\" onclick=\"resetTeamMatch(true)\">結束對抗賽<\/button>`;\n  ov.style.display = 'flex';\n  updateTeamBoard();\n}\n\nfunction recordTeamScore() {\n  if (!team.on || !team.started || team.finished || team.recorded) return false;\n  const cur = team.turns[team.idx];\n  team.rs[cur.t].push(game.score);\n  team.recorded = true;\n  addLog('end', `🏆 ${teamName(cur.t)} 本局 ${game.score} 分，累計 ${teamTotal(cur.t)} 分`);\n  return true;\n}\nfunction showTeamResult() {\n  const cur = team.turns[team.idx];\n  const last = team.idx >= team.turns.length - 1;\n  const ov = document.getElementById('ov');\n  const thisName = teamEsc(teamName(cur.t));\n  if (!last) {\n    const nx = team.turns[team.idx + 1];\n    ov.innerHTML = `\n      <h1 style=\"font-size:34px;text-align:center\">「${thisName}」本局結束！<\/h1>\n      <div class=\"fscore\" style=\"color:${TEAM_COLORS[cur.t % 8]}\">${game.score}<\/div>\n      <div class=\"flab\">本局得分 ・ 累計 ${teamTotal(cur.t)} 分<\/div>\n      ${teamBoardHtml(cur.t, false)}\n      <div style=\"margin-top:10px\">\n        <button class=\"gbtn\" onclick=\"nextTeamTurn()\">➡ 下一組：${teamEsc(teamName(nx.t))}<\/button>\n      <\/div>\n      <p id=\"team-sync-note\" style=\"font-size:12px;color:#aaa;margin-top:10px\"><\/p>\n      <div style=\"margin-top:6px\">\n        <button class=\"hbtn\" onclick=\"publishTeamScores(true)\">📤 重新同步<\/button>\n        <button class=\"hbtn\" onclick=\"resetTeamMatch(true)\">結束對抗賽<\/button>\n      <\/div>`;\n  } else {\n    team.finished = true;\n    const max = Math.max(...Array.from({ length: team.n }, (_, i) => teamTotal(i)));\n    const champs = Array.from({ length: team.n }, (_, i) => i).filter(i => teamTotal(i) === max).map(i => teamEsc(teamName(i)));\n    ov.innerHTML = `\n      <p class=\"sub\" style=\"margin-bottom:4px\">對抗賽結束<\/p>\n      <div class=\"team-champ\">🏆 ${champs.length > 1 ? '並列冠軍：' : '冠軍：'}${champs.join('、')}<\/div>\n      <div class=\"flab\" style=\"margin-bottom:0\">${max} 分<\/div>\n      ${teamBoardHtml(-1, true)}\n      <div style=\"margin-top:10px\">\n        <button class=\"gbtn\" onclick=\"startTeamMatch()\">🔁 再比一次<\/button>\n        <button class=\"gbtn preview-btn\" style=\"margin-right:0\" onclick=\"resetTeamMatch(true)\">回主選單<\/button>\n      <\/div>\n      <p id=\"team-sync-note\" style=\"font-size:12px;color:#aaa;margin-top:12px\"><\/p>\n      <button class=\"hbtn\" style=\"margin-top:6px\" onclick=\"publishTeamScores(true)\">📤 重新同步到分組系統<\/button>`;\n    addLog('sys', `🏁 對抗賽結束，${champs.length > 1 ? '並列冠軍' : '冠軍'}：${champs.join('、')}`);\n  }\n  ov.style.display = 'flex';\n  updateTeamBoard();\n  publishTeamScores(); // 每組打完就把累計成績送到分組系統\n}\nfunction nextTeamTurn() {\n  team.idx++; team.recorded = false;\n  showTeamIntro();\n}\n\n// ── 📤 成績同步到「分組系統」（Firebase：teamScores/<房間代碼>）──\nfunction teamRoomKey() { return ((localStorage.getItem('sf_team_room') || 'default').trim().replace(/[.#$\\[\\]\\/]/g, '_')) || 'default'; }\nfunction setTeamRoom(v) { try { localStorage.setItem('sf_team_room', v.trim()); } catch(e) {} }\nfunction teamSyncNote(msg, color) {\n  const el = document.getElementById('team-sync-note');\n  if (el) { el.textContent = msg; el.style.color = color || '#aaa'; }\n}\nfunction linkReady() { return !!(window.__BUS || window._fbReady); }\nfunction linkSet(path, val) { return window.__BUS ? window.__BUS.set(path, val) : window._fbSet(window._fbRef(window._fbDb, path), val); }\nfunction linkGet(path) { return window.__BUS ? window.__BUS.get(path) : window._fbGet(window._fbRef(window._fbDb, path)); }\nasync function publishTeamScores(manual) {\n  if (!team.on || !team.started || !team.rs.length) { if (manual) addLog('sys', '尚無對抗賽成績可同步'); return; }\n  const key = teamRoomKey();\n  const payload = {\n    updatedAt: Date.now(), finished: !!team.finished, rounds: team.rounds,\n    teams: Array.from({ length: team.n }, (_, i) => ({ index: i, name: teamName(i), total: teamTotal(i), rs: team.rs[i] || [] }))\n  };\n  try { localStorage.setItem('sf_team_scores_' + key, JSON.stringify(payload)); } catch(e) {} // 同網域備援\n  const roomTxt = window.__BUS ? '' : `（房間：${key}）`;\n  if (!linkReady()) { teamSyncNote('⚠️ 雲端尚未連線，成績只存在本機', '#FFB347'); addLog('sys', '⚠️ 雲端尚未連線，成績尚未送到分組系統'); return; }\n  if (!window.__BUS) setSyncStatus('saving'); teamSyncNote('☁️ 同步中…', '#FFD700');\n  try {\n    await linkSet('teamScores/' + key, payload);\n    if (!window.__BUS) setSyncStatus('saved');\n    teamSyncNote(`✅ 已同步到分組系統${roomTxt}`, '#4CAF50');\n    addLog('sys', `📤 已同步 ${team.n} 組成績到分組系統${roomTxt}`);\n  } catch (e) {\n    console.warn('成績同步失敗：', e);\n    if (!window.__BUS) setSyncStatus('error'); teamSyncNote('⚠️ 同步失敗，請按「重新同步」', '#FF6B6B');\n    addLog('esc', '成績同步到分組系統失敗');\n  }\n}\n\n// ── 📥 從「分組系統」匯入組數與組員（Firebase：teamRoster/<房間代碼>）──\nfunction teamMembersHtml(i) {\n  const m = team.members[i];\n  if (!m || !m.length) return '';\n  return `<div class=\"tmembers\">${m.map(n => `<span>${teamEsc(n)}<\/span>`).join('')}<\/div>`;\n}\nfunction rosterNote(msg, color) {\n  const el = document.getElementById('team-roster-note');\n  if (el) { el.textContent = msg; el.style.color = color || '#aaa'; }\n}\nasync function importRoster() {\n  if (teamLocked()) { rosterNote('對抗賽進行中，請先「重設對抗賽」再匯入', '#FFB347'); return; }\n  if (!linkReady()) { rosterNote('⚠️ 雲端尚未連線，無法匯入', '#FFB347'); return; }\n  rosterNote('☁️ 讀取中…', '#FFD700');\n  try {\n    const snap = await linkGet('teamRoster/' + teamRoomKey());\n    if (!snap.exists()) { rosterNote('分組系統尚未送出名單：請先完成分組（單獨使用時兩邊房間代碼要相同）', '#FFB347'); return; }\n    const d = snap.val();\n    const gs = (Array.isArray(d.groups) ? d.groups : Object.values(d.groups || {})).filter(Boolean);\n    if (gs.length < 2) { rosterNote('分組系統只有 ' + gs.length + ' 組，至少要 2 組才能對抗', '#FFB347'); return; }\n    if (team.started) resetTeamMatch(false); // 已結束的對抗賽：換組別後清掉舊成績\n    const n = Math.min(12, gs.length);\n    team.n = n;\n    team.names = [];                       // 名稱與分組檔的「第 N 組」對齊\n    team.members = gs.slice(0, n).map(x => Array.isArray(x.members) ? x.members : Object.values(x.members || {}));\n    saveTeamCfg(); renderTeamConfig(); updateTeamBoard();\n    const people = team.members.reduce((a, m) => a + m.length, 0);\n    rosterNote(`✅ 已匯入 ${n} 組、共 ${people} 人` + (gs.length > n ? `（分組檔有 ${gs.length} 組，最多匯入 ${n} 組）` : ''), '#4CAF50');\n    addLog('sys', `📥 已從分組系統匯入 ${n} 組、${people} 人`);\n  } catch (e) {\n    console.warn('匯入名單失敗：', e);\n    rosterNote('⚠️ 匯入失敗（請檢查資料庫權限）', '#FF6B6B');\n  }\n}\n\nfunction updateTeamBoard() {\n  const hud = document.getElementById('team-hud'), bd = document.getElementById('team-board');\n  if (!hud || !bd) return;\n  if (!team.on) { hud.style.display = 'none'; bd.style.display = 'none'; return; }\n  const cur = (team.started && !team.finished) ? team.turns[team.idx] : null;\n  hud.style.display = cur ? 'flex' : 'none';\n  if (cur) {\n    const nm = document.getElementById('team-hud-name');\n    nm.textContent = teamName(cur.t); nm.style.color = TEAM_COLORS[cur.t % 8];\n  }\n  bd.style.display = team.started ? 'flex' : 'none';\n  if (!team.started) return;\n  bd.innerHTML = '';\n  for (let i = 0; i < team.n; i++) {\n    const live = teamTotal(i) + ((cur && cur.t === i && game.running && !team.recorded) ? game.score : 0);\n    const p = document.createElement('span');\n    p.className = 'tpill' + (cur && cur.t === i ? ' cur' : '');\n    p.innerHTML = `<span class=\"tdot\" style=\"background:${TEAM_COLORS[i % 8]}\"><\/span>${teamEsc(teamName(i))} <b>${live}<\/b>`;\n    bd.appendChild(p);\n  }\n}\nsetInterval(() => { if (team.on && game.running) updateTeamBoard(); }, 400);\nrenderTeamConfig();\nupdateTeamBoard();\n\n// 初始化介面與按鈕事件繫結\nrebuildCategoryPills();\nupdStats();\ndraw();\n<\/script>\n<\/body>\n<\/html>\n\n\n\n";

function mk(id, src){
  const f = document.createElement('iframe');
  f.id = id; f.className = 'frame'; f.srcdoc = src;
  document.body.appendChild(f);
  return f;
}
const fGroup = mk('fr-group', SRC_GROUP);
const fBalloon = mk('fr-balloon', SRC_BALLOON);
let cur = null;

function show(which){
  if (cur === which) return;
  if (cur === 'balloon') { // 離開氣球頁：遊戲進行中就先暫停
    try {
      const w = fBalloon.contentWindow;
      if (w.eval('game.running && !cfg.paused && !isHitPaused')) w.togglePause();
    } catch(e) {}
  }
  cur = which;
  fGroup.classList.toggle('on', which === 'group');
  fBalloon.classList.toggle('on', which === 'balloon');
  document.getElementById('tab-group').classList.toggle('on', which === 'group');
  document.getElementById('tab-balloon').classList.toggle('on', which === 'balloon');
  const fr = which === 'group' ? fGroup : fBalloon;
  try { fr.contentWindow.dispatchEvent(new Event('resize')); fr.contentWindow.focus(); } catch(e) {}
}
document.getElementById('tab-group').onclick = () => show('group');
document.getElementById('tab-balloon').onclick = () => show('balloon');
show('group');
</script>
