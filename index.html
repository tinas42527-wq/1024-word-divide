<body>
<div id="tabs">
  <button id="tab-group" class="on">👥 分組與成績</button>

<script>
// ── 內部匯流排：取代原本經由 Firebase 的成績／名單傳遞（不需網路、不需房間代碼）──
const bus = {
  store: {}, subs: {},
  snap(p){ return { exists: () => p in bus.store, val: () => (p in bus.store) ? JSON.parse(JSON.stringify(bus.store[p])) : null }; },
  async set(p, v){
    bus.store[p] = JSON.parse(JSON.stringify(v));
    (bus.subs[p] || []).slice().forEach(f => { try { f(bus.snap(p)); } catch(e) { console.warn(e); } });
    const t = new Date().toLocaleTimeString('zh-TW', { hour12:false });
    const what = p.startsWith('teamScores') ? '成績' : '名單';
    document.getElementById('linkb').textContent = '🔗 已連線 ・ 最近傳遞：' + what + '（' + t + '）';
  },
  async get(p){ return bus.snap(p); },
  on(p, cb){
    (bus.subs[p] = bus.subs[p] || []).push(cb);
    if (p in bus.store) setTimeout(() => cb(bus.snap(p)), 0);
    return () => { bus.subs[p] = (bus.subs[p] || []).filter(f => f !== cb); };
  }
};
window.__BUS = bus;

\n}\n@media (max-width: 480px) {\n  .board { padding: 28px 16px 76px; }\n  main { padding: 0 14px 56px; }\n  .panel { padding: 16px; }\n}\n\n/* ===== 氣球遊戲成績連線 ===== */\n.link { margin-bottom: 28px; }\n.link-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-top: 12px; }\n.link-row label { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: var(--muted); }\n.link-row input[type=text] { font: inherit; width: 150px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--text); outline: none; }\n.link-row input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); background: var(--card); }\n.link-preview { margin-top: 14px; padding: 10px 14px; background: var(--chip); border: 1px dashed var(--line); border-radius: 10px; font-size: 0.92rem; min-height: 44px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.link-preview .meta { width: 100%; color: var(--muted); font-size: 0.82rem; }\n.link-preview .lk { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-weight: 600; }\n.link-preview .lk b { color: var(--accent); font-size: 1.05rem; }\n<\/style>\n<\/head>\n<body>\n<header class=\"board\">\n  <div class=\"board-in\">\n    <h1>學生自動分組與成績統計<\/h1>\n    <p class=\"sub\">貼上學生名單，隨機分組後記錄組別成績與個人加減分，並可輸出成圖檔。<\/p>\n  <\/div>\n<\/header>\n\n<main>\n<section class=\"setup\">\n  <div class=\"panel roster\">\n    <div class=\"panel-h\"><h2>學生名單<\/h2><span class=\"note\">每行一位，可含班級與座號<\/span><\/div>\n    <textarea id=\"input\" placeholder=\"每行一位學生，例如：&#10;211 01 吳凱瑞&#10;或直接貼上姓名名單\"><\/textarea>\n  <\/div>\n\n  <div class=\"panel settings\">\n    <div class=\"panel-h\"><h2>分組設定<\/h2><\/div>\n    <div class=\"field\">\n      <span class=\"field-l\">分組方式<\/span>\n      <div class=\"seg\">\n        <label><input type=\"radio\" name=\"mode\" value=\"size\" checked>每組人數<\/label>\n        <label><input type=\"radio\" name=\"mode\" value=\"count\">總組數<\/label>\n      <\/div>\n    <\/div>\n    <div class=\"field\">\n      <label class=\"field-l\" for=\"num\">數量<\/label>\n      <div class=\"numctl\">\n        <button type=\"button\" id=\"numMinus\" aria-label=\"減少\">−<\/button>\n        <input type=\"number\" id=\"num\" min=\"1\" step=\"1\" value=\"5\" inputmode=\"numeric\">\n        <button type=\"button\" id=\"numPlus\" aria-label=\"增加\">+<\/button>\n        <span id=\"unit\">人／組<\/span>\n      <\/div>\n    <\/div>\n    <div class=\"preview\" id=\"preview\"><\/div>\n    <div class=\"actions\">\n      <button class=\"primary\" id=\"go\">開始自動分組<\/button>\n      <button id=\"shuffle\">重新隨機分組<\/button>\n    <\/div>\n    <div class=\"warn\" id=\"warn\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"panel link\" id=\"balloonLink\">\n  <div class=\"panel-h\"><h2>🎈 氣球遊戲成績連線<\/h2><span class=\"note\" id=\"linkStatus\">連線中…<\/span><\/div>\n  <p class=\"note\" style=\"margin:0\">氣球遊戲每組打完會自動送出累計成績；第 N 隊會對應到下方「第 N 組」的組別成績。<\/p>\n  <div class=\"link-row\">\n    <label>房間代碼 <input type=\"text\" id=\"roomCode\" placeholder=\"default\"><\/label>\n    <label><input type=\"checkbox\" id=\"autoApply\" checked> 收到成績自動填入組別成績<\/label>\n    <label><input type=\"checkbox\" id=\"pubRoster\" checked> 同步分組名單給氣球遊戲（只送姓名）<\/label>\n  <\/div>\n  <div class=\"link-preview\" id=\"linkPreview\"><\/div>\n  <p class=\"note\" id=\"rosterNote\" style=\"margin:10px 0 0\"><\/p>\n  <div class=\"actions\"><button class=\"primary\" id=\"applyScores\">套用氣球成績到組別成績<\/button><\/div>\n  <div class=\"warn\" id=\"linkWarn\"><\/div>\n<\/section>\n\n<section class=\"results\">\n  <div class=\"res-h\">\n    <div class=\"res-title\"><h2>分組結果<\/h2><span class=\"info\" id=\"info\"><\/span><\/div>\n    <div class=\"res-actions\">\n      <button id=\"copy\">複製結果文字<\/button>\n      <button id=\"exportXlsx\" class=\"outline\">輸出試算表<\/button>\n      <button id=\"exportPdf\" class=\"outline\">輸出 PDF<\/button>\n      <button id=\"exportImg\" class=\"outline\">輸出圖檔<\/button>\n    <\/div>\n  <\/div>\n  <p class=\"hint\">提示：拖曳成員可換組。每組可輸入組別成績，成員旁可個人加減分，系統自動算出個人總成績。<\/p>\n  <div class=\"grid\" id=\"out\"><\/div>\n<\/section>\n<\/main>\n\n<script type=\"module\">\n  import { initializeApp } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js\";\n  import { getDatabase, ref, onValue, set } from \"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js\";\n  const app = initializeApp({ databaseURL: \"https://word-420e5-default-rtdb.asia-southeast1.firebasedatabase.app/\" });\n  window._fbDb = getDatabase(app);\n  window._fbRef = ref;\n  window._fbOnValue = onValue;\n  window._fbSet = set;\n  window._fbReady = true;\n  document.dispatchEvent(new Event('firebaseReady'));\n<\/script>\n<script>\nconst DEFAULT = `211 01 吳凱瑞\n211 02 李忻翰\n211 18 秦永怡\n211 20 張苡宣\n211 23 陳佳妤\n211 25 陳譽臻\n211 26 程筠筑\n211 28 楊子萱\n211 32 盧寀璇\n211 33 簡睦澄\n218 01 石東諭\n218 06 徐浩椉\n218 11 楊喆宇\n218 14 巫若涵\n218 21 徐詩恩\n218 26 黃芯秜\n218 27 黃薏芯\n218 28 雷蕾\n218 30 廖妍芯\n218 31 劉又瑄\n218 35 蕭明涓`;\n\nconst $=id=>document.getElementById(id);\nlet groups=[];\nconst HUES=[165,215,265,335,25,95,45,190];\n\nfunction parse(text){\n  const list=[];\n  text.split(/\\r?\\n/).forEach(line=>{\n    const t=line.trim().split(/[\\s,，、|;；\\t]+/).filter(Boolean);\n    const nums=t.filter(x=>/^\\d+$/.test(x));\n    const names=t.filter(x=>!/^\\d+$/.test(x));\n    if(names.length===1) list.push({name:names[0],tag:nums.join('-')});\n    else names.forEach(n=>list.push({name:n,tag:''}));\n  });\n  return list;\n}\n\nfunction shuffleArr(a){\n  a=a.slice();\n  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}\n  return a;\n}\n\nfunction getOpts(){\n  const mode=document.querySelector('input[name=\"mode\"]:checked').value;\n  const v=Math.max(1,Math.floor(parseFloat($('num').value))||1);\n  return {mode,v};\n}\n\nfunction groupCount(n){\n  const {mode,v}=getOpts();\n  if(mode==='count') return Math.min(v,n);\n  return Math.max(1,Math.ceil(n/v));\n}\n\nfunction split(list){\n  const n=list.length;\n  if(!n) return [];\n  const g=groupCount(n);\n  const base=Math.floor(n/g), extra=n%g;\n  const res=[];let k=0;\n  for(let i=0;i<g;i++){\n    const size=base+(i<extra?1:0);\n    res.push(list.slice(k,k+size));k+=size;\n  }\n  return res;\n}\n\nfunction updatePreview(){\n  const {mode}=getOpts();\n  $('unit').textContent=mode==='size'?'人／組':'組';\n  const n=parse($('input').value).length;\n  if(!n){$('preview').textContent='';return;}\n  const g=groupCount(n);\n  const lo=Math.floor(n/g), hi=Math.ceil(n/g);\n  $('preview').textContent='預計 '+g+' 組，每組 '+(lo===hi?lo:lo+'～'+hi)+' 人';\n}\n\nfunction move(from,idx,to){\n  const [s]=groups[from].splice(idx,1);\n  if(to==='new')groups.push([s]);else groups[to].push(s);\n  groups=groups.filter(g=>g.length);\n  render();\n}\n\nfunction render(){\n  groups=groups.filter(g=>g.length);\n  const out=$('out');out.innerHTML='';\n  groups.forEach((g,i)=>{\n    const d=document.createElement('div');d.className='group';d.style.setProperty('--h',HUES[i%HUES.length]);\n    const h=document.createElement('h3');\n    h.innerHTML='<span>第 '+(i+1)+' 組<\/span><span class=\"badge\">'+g.length+' 人<\/span>';\n    const ul=document.createElement('ul');\n    const gScore = parseFloat(g.score) || 0;\n\n    g.forEach((s,j)=>{\n      const li=document.createElement('li');li.draggable=true;\n      li.ondragstart=e=>e.dataTransfer.setData('text/plain',i+','+j);\n      \n      const a=document.createElement('span');a.className='nm';a.textContent=s.name;\n      const b=document.createElement('small');b.className='tag';b.textContent=s.tag;\n      \n      const pts = s.pts || 0;\n      const total = gScore + pts;\n\n      const pm=document.createElement('span');pm.className='pt';\n      const mk=(t,dv)=>{const bt=document.createElement('button');bt.textContent=t;bt.onclick=()=>{s.pts=(s.pts||0)+dv;render();};return bt;};\n      const val=document.createElement('b');val.textContent=pts>0?'+'+pts:String(pts);\n      pm.append(mk('−',-1),val,mk('+',1));\n\n      const tot=document.createElement('span');tot.className='tot';\n      tot.innerHTML=`總分 <b>${total}<\/b> <small>(${gScore}${pts>=0?'+':''}${pts})<\/small>`;\n\n      const x=document.createElement('button');x.className='del';x.textContent='✕';x.title='刪除成員';\n      x.onclick=()=>{groups[i].splice(j,1);render();};\n\n      const who=document.createElement('div');who.className='who';who.append(a,b);\n      const calc=document.createElement('div');calc.className='calc';calc.append(pm,tot);\n      li.append(who,x,calc);ul.append(li);\n    });\n\n    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};\n    d.ondragleave=()=>d.classList.remove('over');\n    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');\n      const p=(e.dataTransfer.getData('text/plain')||'').split(',').map(Number);\n      if(p.length===2&&!isNaN(p[0])&&p[0]!==i)move(p[0],p[1],i);};\n    \n    const sc=document.createElement('div');sc.className='score';\n    const lb=document.createElement('span');lb.textContent='組別成績';\n    const inp=document.createElement('input');inp.type='number';inp.step='any';inp.inputMode='decimal';inp.placeholder='輸入組分數';\n    inp.value=g.score??'';\n    inp.oninput=()=>{\n      g.score=inp.value;\n      const curGScore = parseFloat(g.score) || 0;\n      ul.querySelectorAll('li').forEach((li, idx)=>{\n        const s = g[idx];\n        const pts = s.pts || 0;\n        const totEl = li.querySelector('.tot');\n        if(totEl){\n          totEl.innerHTML = `總分 <b>${curGScore + pts}<\/b> <small>(${curGScore}${pts>=0?'+':''}${pts})<\/small>`;\n        }\n      });\n    };\n    sc.append(lb,inp);\n    d.append(h,ul,sc);out.append(d);\n  });\n  const total=groups.reduce((n,g)=>n+g.length,0);\n  $('info').textContent=total?('共 '+total+' 人，'+groups.length+' 組'):'';\n  scheduleRoster();\n}\n\nfunction needGroups(){\n  if(!groups.length){alert('目前沒有組別資料可匯出！');return false;}\n  return true;\n}\n\nfunction buildReport(){\n  const canvas = document.createElement('canvas');\n  const ctx = canvas.getContext('2d');\n  const width = 900;\n  const padding = 36;\n  const headerHeight = 90;\n\n  let contentHeight = headerHeight + 15;\n  groups.forEach(g => {\n    contentHeight += 38 + 30 + g.length * 36 + 8 + 24;\n  });\n  contentHeight += padding;\n\n  canvas.width = width * 2; // High DPI 畫質優化\n  canvas.height = contentHeight * 2;\n  ctx.scale(2, 2);\n\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(0, 0, width, contentHeight);\n\n  // Title\n  ctx.fillStyle = '#0f172a';\n  ctx.font = 'bold 24px \"Noto Sans TC\", sans-serif';\n  ctx.fillText('學生組別與成績統計總表', padding, 48);\n\n  ctx.fillStyle = '#64748b';\n  ctx.font = '13px \"Noto Sans TC\", sans-serif';\n  const now = new Date();\n  const dateStr = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate() + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');\n  ctx.fillText(`產生時間：${dateStr}  |  總計：${groups.reduce((n,g)=>n+g.length,0)} 人，共 ${groups.length} 組`, padding, 72);\n\n  ctx.strokeStyle = '#e2e8f0';\n  ctx.lineWidth = 1;\n  ctx.beginPath();\n  ctx.moveTo(padding, 82);\n  ctx.lineTo(width - padding, 82);\n  ctx.stroke();\n\n  let y = headerHeight + 15;\n  const tops = [];\n\n  groups.forEach((g, idx) => {\n    const gScore = parseFloat(g.score) || 0;\n    const cardWidth = width - padding * 2;\n    const cardHeaderHeight = 38;\n    const tableHeaderHeight = 30;\n    const rowHeight = 36;\n    const cardHeight = cardHeaderHeight + tableHeaderHeight + g.length * rowHeight + 8;\n    tops.push({y, h: cardHeight});\n\n    // Card boundary\n    ctx.strokeStyle = '#cbd5e1';\n    ctx.lineWidth = 1;\n    ctx.strokeRect(padding, y, cardWidth, cardHeight);\n\n    // Header background\n    ctx.fillStyle = `hsl(${HUES[idx%HUES.length]},52%,40%)`;\n    ctx.fillRect(padding, y, cardWidth, cardHeaderHeight);\n\n    // Group Title\n    ctx.fillStyle = '#ffffff';\n    ctx.font = 'bold 15px \"Noto Sans TC\", sans-serif';\n    ctx.fillText(`第 ${idx + 1} 組 (${g.length} 人)`, padding + 16, y + 24);\n\n    ctx.font = '14px \"Noto Sans TC\", sans-serif';\n    const scoreTxt = `組別成績：${g.score !== undefined && g.score !== '' ? g.score + ' 分' : '未輸入'}`;\n    ctx.fillText(scoreTxt, padding + cardWidth - ctx.measureText(scoreTxt).width - 16, y + 24);\n\n    let curY = y + cardHeaderHeight;\n\n    // Table Header\n    ctx.fillStyle = '#f1f5f9';\n    ctx.fillRect(padding, curY, cardWidth, tableHeaderHeight);\n\n    ctx.fillStyle = '#475569';\n    ctx.font = 'bold 13px \"Noto Sans TC\", sans-serif';\n    \n    const colName = padding + 16;\n    const colTag = padding + 180;\n    const colGScore = padding + 350;\n    const colPts = padding + 490;\n    const colTotal = padding + 640;\n\n    ctx.fillText('姓名', colName, curY + 20);\n    ctx.fillText('標籤/座號', colTag, curY + 20);\n    ctx.fillText('組別成績', colGScore, curY + 20);\n    ctx.fillText('個人加分', colPts, curY + 20);\n    ctx.fillText('個人總成績', colTotal, curY + 20);\n\n    curY += tableHeaderHeight;\n\n    // Rows\n    g.forEach((s, sIdx) => {\n      if (sIdx % 2 === 1) {\n        ctx.fillStyle = '#f8fafc';\n        ctx.fillRect(padding + 1, curY, cardWidth - 2, rowHeight);\n      }\n\n      ctx.strokeStyle = '#f1f5f9';\n      ctx.beginPath();\n      ctx.moveTo(padding, curY);\n      ctx.lineTo(padding + cardWidth, curY);\n      ctx.stroke();\n\n      const pts = s.pts || 0;\n      const totalScore = gScore + pts;\n\n      ctx.fillStyle = '#0f172a';\n      ctx.font = '14px \"Noto Sans TC\", sans-serif';\n      ctx.fillText(s.name, colName, curY + 23);\n\n      ctx.fillStyle = '#64748b';\n      ctx.font = '13px \"Noto Sans TC\", sans-serif';\n      ctx.fillText(s.tag || '-', colTag, curY + 23);\n\n      ctx.fillStyle = '#334155';\n      ctx.fillText(`${gScore} 分`, colGScore, curY + 23);\n\n      const ptsStr = pts > 0 ? `+${pts}` : `${pts}`;\n      ctx.fillStyle = pts > 0 ? '#16a34a' : (pts < 0 ? '#dc2626' : '#64748b');\n      ctx.fillText(ptsStr, colPts, curY + 23);\n\n      ctx.fillStyle = '#2563eb';\n      ctx.font = 'bold 14px \"Noto Sans TC\", sans-serif';\n      ctx.fillText(`${totalScore} 分 (${gScore}${pts>=0?'+':''}${pts})`, colTotal, curY + 23);\n\n      curY += rowHeight;\n    });\n\n    y += cardHeight + 24;\n  });\n\n  return {canvas, width, contentHeight, tops};\n}\n\nfunction exportImage(){\n  if(!needGroups()) return;\n  const {canvas}=buildReport();\n  const link = document.createElement('a');\n  link.download = `學生成績總表_${localDate()}.png`;\n  link.href = canvas.toDataURL('image/png');\n  link.click();\n}\n\nfunction exportXlsx(){\n  if(!needGroups()) return;\n  downloadBlob(buildXlsx(groups),`學生成績總表_${localDate()}.xlsx`);\n}\n\nfunction exportPDF(){\n  if(!needGroups()) return;\n  const {canvas,width:W,tops:t0}=buildReport();\n  const tops=t0.map(o=>({...o}));\n  const pageH=Math.round(W*297/210), margin=28, footer=34;\n  const pages=[];\n  let i=0, first=true;\n  while(i<tops.length){\n    const top=first?0:margin, avail=pageH-top-footer;\n    const start=first?0:tops[i].y-6;\n    let j=i, end=start;\n    while(j<tops.length && tops[j].y+tops[j].h-start<=avail){end=tops[j].y+tops[j].h;j++;}\n    if(j===i){ // 單一組別超過一頁：依頁高切開\n      pages.push({y0:start,y1:start+avail,top});\n      const cut=start+avail;\n      tops[i]={y:cut,h:tops[i].y+tops[i].h-cut};\n    }else{\n      pages.push({y0:start,y1:end+6,top});\n      i=j;\n    }\n    first=false;\n  }\n  const jpegs=pages.map((p,n)=>{\n    const c=document.createElement('canvas');\n    c.width=W*2;c.height=pageH*2;\n    const x=c.getContext('2d');\n    x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);\n    const sh=Math.min((p.y1-p.y0)*2,canvas.height-p.y0*2);\n    x.drawImage(canvas,0,p.y0*2,W*2,sh,0,p.top*2,W*2,sh);\n    x.fillStyle='#94a3b8';x.font='22px \"Noto Sans TC\", sans-serif';x.textAlign='center';\n    x.fillText(`第 ${n+1} / ${pages.length} 頁`,W,(pageH-12)*2);\n    const b64=c.toDataURL('image/jpeg',0.92).split(',')[1];\n    return {bytes:Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0)),w:c.width,h:c.height};\n  });\n  downloadBlob(buildPDF(jpegs),`學生成績總表_${localDate()}.pdf`);\n}\n\n// ==== EXPORT START（試算表 / PDF 產生器，不需外部套件）====\nfunction localDate(){\n  const d=new Date();\n  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');\n}\nfunction downloadBlob(blob,name){\n  const a=document.createElement('a');\n  a.href=URL.createObjectURL(blob);a.download=name;\n  document.body.append(a);a.click();a.remove();\n  setTimeout(()=>URL.revokeObjectURL(a.href),4000);\n}\n\nconst CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();\nfunction crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}\n\nfunction zipStore(files,mime){\n  const enc=new TextEncoder(),parts=[],central=[];let off=0;\n  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];\n  files.forEach(f=>{\n    const data=enc.encode(f.data),nm=enc.encode(f.name),crc=crc32(data),sz=data.length;\n    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);\n    parts.push(lh,nm,data);central.push({nm,crc,sz,off});\n    off+=lh.length+nm.length+sz;\n  });\n  const cdStart=off;let cdSize=0;\n  central.forEach(c=>{\n    const h=new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c.crc),...u32(c.sz),...u32(c.sz),...u16(c.nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(c.off)]);\n    parts.push(h,c.nm);cdSize+=h.length+c.nm.length;\n  });\n  parts.push(new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(central.length),...u16(central.length),...u32(cdSize),...u32(cdStart),...u16(0)]));\n  return new Blob(parts,{type:mime});\n}\n\nconst xe=s=>String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');\nfunction cellXml(ref,c,style){\n  if(c===null||c===undefined||c==='') return '';\n  const st=style?` s=\"${style}\"`:'';\n  if(typeof c==='number') return `<c r=\"${ref}\"${st}><v>${c}<\/v><\/c>`;\n  if(typeof c==='object') return `<c r=\"${ref}\"${st}><f>${xe(c.f)}<\/f><v>${c.v}<\/v><\/c>`;\n  return `<c r=\"${ref}\"${st} t=\"inlineStr\"><is><t xml:space=\"preserve\">${xe(c)}<\/t><\/is><\/c>`;\n}\nfunction sheetXml(rows,widths){\n  const cols=widths.map((w,i)=>`<col min=\"${i+1}\" max=\"${i+1}\" width=\"${w}\" customWidth=\"1\"/>`).join('');\n  const body=rows.map((r,ri)=>`<row r=\"${ri+1}\">`+r.map((c,ci)=>cellXml(String.fromCharCode(65+ci)+(ri+1),c,ri===0?1:0)).join('')+'<\/row>').join('');\n  return '<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?><worksheet xmlns=\"http://schemas.openxmlformats.org/spreadsheetml/2006/main\"><sheetViews><sheetView workbookViewId=\"0\"><pane ySplit=\"1\" topLeftCell=\"A2\" activePane=\"bottomLeft\" state=\"frozen\"/><\/sheetView><\/sheetViews><cols>'+cols+'<\/cols><sheetData>'+body+'<\/sheetData><\/worksheet>';\n}\n\nfunction buildXlsx(groups){\n  const S1=\"'成績總表'\";\n  const rows1=[['組別','姓名','標籤/座號','組別成績','個人加減分','個人總成績']];\n  const rows2=[['組別','人數','組別成績','平均個人總成績']];\n  groups.forEach((g,gi)=>{\n    const raw=parseFloat(g.score), gs=isNaN(raw)?0:raw, label='第 '+(gi+1)+' 組';\n    let sum=0;\n    g.forEach(s=>{\n      const pts=s.pts||0, r=rows1.length+1;\n      sum+=gs+pts;\n      rows1.push([label,s.name,s.tag||'',isNaN(raw)?null:raw,pts,{f:'D'+r+'+E'+r,v:gs+pts}]);\n    });\n    const r2=rows2.length+1;\n    rows2.push([label,{f:`COUNTIF(${S1}!A:A,A${r2})`,v:g.length},isNaN(raw)?null:raw,{f:`AVERAGEIF(${S1}!A:A,A${r2},${S1}!F:F)`,v:Math.round(sum/g.length*100)/100}]);\n  });\n  const NS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';\n  const RN='http://schemas.openxmlformats.org/officeDocument/2006/relationships';\n  const PR='http://schemas.openxmlformats.org/package/2006/relationships';\n  const H='<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>';\n  const files=[\n    {name:'[Content_Types].xml',data:H+'<Types xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\"><Default Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/><Default Extension=\"xml\" ContentType=\"application/xml\"/><Override PartName=\"/xl/workbook.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml\"/><Override PartName=\"/xl/worksheets/sheet1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/><Override PartName=\"/xl/worksheets/sheet2.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml\"/><Override PartName=\"/xl/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml\"/><\/Types>'},\n    {name:'_rels/.rels',data:H+`<Relationships xmlns=\"${PR}\"><Relationship Id=\"rId1\" Type=\"${RN}/officeDocument\" Target=\"xl/workbook.xml\"/><\/Relationships>`},\n    {name:'xl/workbook.xml',data:H+`<workbook xmlns=\"${NS}\" xmlns:r=\"${RN}\"><sheets><sheet name=\"成績總表\" sheetId=\"1\" r:id=\"rId1\"/><sheet name=\"組別統計\" sheetId=\"2\" r:id=\"rId2\"/><\/sheets><\/workbook>`},\n    {name:'xl/_rels/workbook.xml.rels',data:H+`<Relationships xmlns=\"${PR}\"><Relationship Id=\"rId1\" Type=\"${RN}/worksheet\" Target=\"worksheets/sheet1.xml\"/><Relationship Id=\"rId2\" Type=\"${RN}/worksheet\" Target=\"worksheets/sheet2.xml\"/><Relationship Id=\"rId3\" Type=\"${RN}/styles\" Target=\"styles.xml\"/><\/Relationships>`},\n    {name:'xl/styles.xml',data:H+`<styleSheet xmlns=\"${NS}\"><fonts count=\"2\"><font><sz val=\"11\"/><name val=\"Calibri\"/><\/font><font><b/><sz val=\"11\"/><color rgb=\"FFFFFFFF\"/><name val=\"Calibri\"/><\/font><\/fonts><fills count=\"3\"><fill><patternFill patternType=\"none\"/><\/fill><fill><patternFill patternType=\"gray125\"/><\/fill><fill><patternFill patternType=\"solid\"><fgColor rgb=\"FF2C7A67\"/><bgColor indexed=\"64\"/><\/patternFill><\/fill><\/fills><borders count=\"1\"><border><left/><right/><top/><bottom/><diagonal/><\/border><\/borders><cellStyleXfs count=\"1\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\"/><\/cellStyleXfs><cellXfs count=\"2\"><xf numFmtId=\"0\" fontId=\"0\" fillId=\"0\" borderId=\"0\" xfId=\"0\"/><xf numFmtId=\"0\" fontId=\"1\" fillId=\"2\" borderId=\"0\" xfId=\"0\" applyFont=\"1\" applyFill=\"1\"/><\/cellXfs><cellStyles count=\"1\"><cellStyle name=\"Normal\" xfId=\"0\" builtinId=\"0\"/><\/cellStyles><\/styleSheet>`},\n    {name:'xl/worksheets/sheet1.xml',data:sheetXml(rows1,[12,14,14,12,12,14])},\n    {name:'xl/worksheets/sheet2.xml',data:sheetXml(rows2,[12,10,12,16])}\n  ];\n  return zipStore(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');\n}\n\n// jpegs: [{bytes:Uint8Array,w,h}]，每頁為一張滿版 A4 圖片\nfunction buildPDF(jpegs){\n  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;\n  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length;};\n  const PW=595.28,PH=841.89,n=jpegs.length;\n  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\\n');fn();push('\\nendobj\\n');};\n  push('%PDF-1.4\\n');\n  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));\n  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`));\n  jpegs.forEach((im,i)=>{\n    const pid=3+3*i,cid=4+3*i,iid=5+3*i,content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;\n    obj(pid,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`));\n    obj(cid,()=>push(`<< /Length ${content.length} >>\\nstream\\n${content}\\nendstream`));\n    obj(iid,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\\nstream\\n`);push(im.bytes);push('\\nendstream');});\n  });\n  const total=3+3*n,xref=len;\n  push(`xref\\n0 ${total}\\n0000000000 65535 f \\n`);\n  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \\n');\n  push(`trailer\\n<< /Size ${total} /Root 1 0 R >>\\nstartxref\\n${xref}\\n%%EOF`);\n  return new Blob(chunks,{type:'application/pdf'});\n}\n// ==== EXPORT END ====\n\n\nfunction run(){\n  const list=parse($('input').value);\n  const n=list.length;\n  groups=split(shuffleArr(list));\n  render();\n  $('info').textContent=n?('共 '+n+' 人，分成 '+groups.length+' 組'):'';\n  const {mode,v}=getOpts();\n  let w='';\n  if(n&&mode==='count'&&v>n) w='⚠️ 組數多於總人數，已自動調整為 '+n+' 組（每組 1 人）。';\n  else if(n&&mode==='size'&&v>n) w='⚠️ 每組人數大於總人數，所有人將分在同一組。';\n  $('warn').textContent=w;\n  updatePreview();\n  reapplyBalloon();\n}\n\n$('go').onclick=run;\ndocument.querySelectorAll('input[name=\"mode\"]').forEach(r=>r.onchange=()=>{\n  $('num').value=r.value==='size'?5:4; // 切換模式時給預設值\n  updatePreview();\n});\n$('num').oninput=updatePreview;\n$('input').addEventListener('input',updatePreview);\n$('numMinus').onclick=()=>{$('num').value=Math.max(1,(parseInt($('num').value)||1)-1);updatePreview();};\n$('numPlus').onclick=()=>{$('num').value=(parseInt($('num').value)||0)+1;updatePreview();};\n$('num').addEventListener('keydown',e=>{if(e.key==='Enter')run();});\n$('shuffle').onclick=run;\n$('exportImg').onclick=exportImage;\n$('exportXlsx').onclick=exportXlsx;\n$('exportPdf').onclick=exportPDF;\n$('copy').onclick=()=>{\n  const txt=groups.map((g,i)=>'第 '+(i+1)+' 組：'+g.map(s=>{\n    const gScore = parseFloat(g.score) || 0;\n    const pts = s.pts || 0;\n    return `${s.name}(組分:${gScore}, 個人:${pts>=0?'+':''}${pts}, 總分:${gScore+pts})`;\n  }).join('、')+(g.score?'（組別成績：'+g.score+'）':'')).join('\\n');\n  const done=()=>{$('copy').textContent='已複製 ✓';setTimeout(()=>$('copy').textContent='複製結果文字',1500)};\n  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>{});\n  else{const t=document.createElement('textarea');t.value=txt;document.body.append(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove();}\n};\n\n/* ===== 氣球遊戲成績連線（Firebase：teamScores/<房間代碼>）===== */\nconst ICON = window.__BUS ? '🔗' : '☁️';\nconst linkApi = {\n  ready(){ return !!(window.__BUS || window._fbReady); },\n  set(path, val){ return window.__BUS ? window.__BUS.set(path, val) : window._fbSet(window._fbRef(window._fbDb, path), val); },\n  on(path, cb, err){ return window.__BUS ? window.__BUS.on(path, cb) : window._fbOnValue(window._fbRef(window._fbDb, path), cb, err); }\n};\nlet balloonData = null, balloonUnsub = null, lastApplied = 0;\nlet rosterSig = '', rosterTimer = null;\nconst ROOM_KEY = 'sf_team_room';\nfunction roomKey(){ return (($('roomCode').value || 'default').trim().replace(/[.#$\\[\\]\\/]/g,'_')) || 'default'; }\nfunction escH(s){ return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction balloonTeams(){ return balloonData && Array.isArray(balloonData.teams) ? balloonData.teams.filter(Boolean) : []; }\n\nfunction renderLink(){\n  const box = $('linkPreview'), teams = balloonTeams();\n  if(!teams.length){ box.innerHTML = '<span class=\"note\">尚未收到氣球遊戲成績（房間：'+escH(roomKey())+'）<\/span>'; $('linkWarn').textContent=''; return; }\n  const when = balloonData.updatedAt ? new Date(balloonData.updatedAt).toLocaleTimeString('zh-TW',{hour12:false}) : '';\n  box.innerHTML = '<div class=\"meta\">'+(balloonData.finished?'✅ 對抗賽已結束':'⏳ 對抗賽進行中')+(when?' ・ 更新於 '+when:'')+'<\/div>' +\n    teams.map(t=>'<span class=\"lk\">氣球「'+escH(t.name||('第'+(t.index+1)+'隊'))+'」→ 第 '+(t.index+1)+' 組：<b>'+(t.total||0)+'<\/b> 分<\/span>').join('');\n  $('linkWarn').textContent = (groups.length && teams.length!==groups.length)\n    ? '⚠️ 氣球遊戲有 '+teams.length+' 隊，目前分組結果有 '+groups.length+' 組；只會套用到編號相同的組別。' : '';\n}\nfunction applyBalloon(){\n  const teams = balloonTeams();\n  if(!teams.length || !groups.length) return 0;\n  let n = 0;\n  teams.forEach(t=>{ const gp = groups[t.index]; if(gp){ gp.score = String(t.total||0); n++; } });\n  lastApplied = balloonData.updatedAt || 0;\n  render();\n  return n;\n}\nfunction reapplyBalloon(){ if($('autoApply') && $('autoApply').checked && balloonTeams().length) applyBalloon(); }\nfunction onBalloonData(data){\n  balloonData = data;\n  renderLink();\n  if(balloonTeams().length && $('autoApply').checked && (balloonData.updatedAt||0) !== lastApplied) applyBalloon();\n}\nfunction startLink(){\n  if(balloonUnsub){ try{balloonUnsub();}catch(e){} balloonUnsub=null; }\n  balloonData = null; lastApplied = 0; renderLink();\n  if(window.__BUS){ const lb=$('roomCode').closest('label'); if(lb) lb.style.display='none'; }\n  if(!linkApi.ready()){ $('linkStatus').textContent='⚠️ 雲端未連線（改用同網域本機資料）'; return; }\n  $('linkStatus').textContent=ICON+' 已連線，等待氣球遊戲成績';\n  balloonUnsub = linkApi.on('teamScores/'+roomKey(),\n    snap=>{ onBalloonData(snap.exists()?snap.val():null); $('linkStatus').textContent = balloonTeams().length ? ICON+' 已收到成績' : ICON+' 已連線，等待氣球遊戲成績'; },\n    ()=>{ $('linkStatus').textContent='⚠️ 讀取失敗（請檢查資料庫權限）'; });\n  rosterSig = ''; scheduleRoster(true);\n}\n$('roomCode').value = localStorage.getItem(ROOM_KEY) || '';\n$('roomCode').onchange = ()=>{ try{localStorage.setItem(ROOM_KEY,$('roomCode').value.trim());}catch(e){} startLink(); };\n$('applyScores').onclick = ()=>{\n  if(!groups.length){ alert('請先完成分組。'); return; }\n  if(!balloonTeams().length){ alert('目前還沒有收到氣球遊戲成績。'); return; }\n  const n = applyBalloon();\n  $('applyScores').textContent = '已套用 '+n+' 組 ✓';\n  setTimeout(()=>$('applyScores').textContent='套用氣球成績到組別成績',1500);\n};\nwindow.addEventListener('storage', e=>{ // 同網域備援：氣球與分組在同一網域時可即時接收\n  if(e.key === 'sf_team_scores_'+roomKey() && e.newValue && !window._fbReady){ try{ onBalloonData(JSON.parse(e.newValue)); }catch(_){} }\n});\nif(linkApi.ready()) startLink();\nelse {\n  document.addEventListener('firebaseReady', startLink);\n  setTimeout(()=>{ if(!window._fbReady){ $('linkStatus').textContent='⚠️ 雲端未連線'; } }, 6000);\n}\n\n/* ===== 同步分組名單給氣球遊戲（Firebase：teamRoster/<房間代碼>；只送姓名）===== */\n\nfunction scheduleRoster(force){ clearTimeout(rosterTimer); rosterTimer = setTimeout(()=>publishRoster(force), 500); }\nasync function publishRoster(force){\n  const cb = $('pubRoster'), note = $('rosterNote');\n  if(!cb || !cb.checked || !linkApi.ready() || !groups.length) return;\n  const sig = JSON.stringify(groups.map(gp=>gp.map(s=>s.name)));\n  if(!force && sig === rosterSig) return;\n  try{\n    await linkApi.set('teamRoster/'+roomKey(), {\n      updatedAt: Date.now(),\n      groups: groups.map((gp,i)=>({ index:i, name:'第'+(i+1)+'組', members: gp.map(s=>s.name) }))\n    });\n    rosterSig = sig;\n    if(note) note.textContent = '📤 已把 '+groups.length+' 組名單送給氣球遊戲'+(window.__BUS?'':'（房間：'+roomKey()+'）')+'，到氣球遊戲頁按「匯入組數與組員」即可。';\n  }catch(e){ if(note) note.textContent = '⚠️ 名單同步失敗（請檢查資料庫權限）'; }\n}\n$('pubRoster').onchange = ()=>{ rosterSig=''; if($('pubRoster').checked) scheduleRoster(true); else $('rosterNote').textContent='已停止同步名單。'; };\n\n$('input').value=DEFAULT;\nrun();\n<\/script>\n<\/body>\n<\/html>\n";

}\n.team-champ{font-size:30px;font-weight:900;color:#FFD700;margin:4px 0 2px;text-align:center}\n<\/style>\n<\/head>\n<body>\n\n<div id=\"play-page\" class=\"page active\">\n  <div id=\"game-area\">\n    <div id=\"hud\">\n      <div class=\"hv\"><span class=\"hl\">SCORE<\/span><span class=\"hd\" id=\"sc-el\">0<\/span><\/div>\n      <div class=\"hv\"><span class=\"hl\">COMBO<\/span><span id=\"combo-el\">x1<\/span><\/div>\n      <div class=\"hv\"><span class=\"hl\">TIME LEFT<\/span><span class=\"hd\" style=\"color:#5B9FFF\"><span id=\"tm-el\">60<\/span>s<\/span><\/div>\n      <div class=\"hv\"><span class=\"hl\">MONKEY LIVES<\/span><span id=\"lives-el\">❤❤❤<\/span><\/div>\n      <div class=\"hv\" id=\"team-hud\"><span class=\"hl\">NOW PLAYING<\/span><span id=\"team-hud-name\"><\/span><\/div>\n      <div id=\"team-board\"><\/div>\n      <div id=\"pause-bar\">\n        <button class=\"hbtn\" id=\"pp-btn\" onclick=\"togglePause()\">⏸ 暫停<\/button>\n        <button class=\"hbtn\" onclick=\"panelReset()\">🔄 重置<\/button>\n        <button class=\"hbtn admin-btn\" onclick=\"switchPage('admin')\">⚙️ 詞彙資料庫管理後台<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"cv-wrap\">\n      <canvas id=\"cv\"><\/canvas>\n      \n      <div id=\"preview-overlay\">\n        <div class=\"preview-header\">\n          <h2>🃏 本局詞彙預習卡片<\/h2>\n          <p>點擊個別卡牌或使用下方工具列一鍵切換，配合手語教材進行記憶預習吧！<\/p>\n        <\/div>\n        \n        <div class=\"preview-toolbar\">\n          <button class=\"tbtn\" onclick=\"flipAllCards(true)\">👁️ 全部蓋牌 (開啟盲測)<\/button>\n          <button class=\"tbtn\" onclick=\"flipAllCards(false)\">🔓 全部翻開 (顯示中文)<\/button>\n          <button class=\"tbtn\" onclick=\"exportCardsImage(true)\">📄 匯出 PDF (含中文)<\/button>\n          <button class=\"tbtn\" onclick=\"exportCardsImage(false)\">📄 匯出 PDF (空白練習版)<\/button>\n        <\/div>\n\n        <div class=\"card-grid\" id=\"preview-card-grid\"><\/div>\n        <div>\n          <button class=\"gbtn\" style=\"background: rgba(255,255,255,0.15); color: #fff; margin-right: 12px;\" onclick=\"closePreview()\">⬅ 返回主選單<\/button>\n          <button class=\"gbtn\" onclick=\"closePreview(); startGame();\">🚀 預習完畢，直接開戰！<\/button>\n        <\/div>\n      <\/div>\n      \n      <div id=\"live-learning-box\">\n        <div class=\"ll-title\">✨ 請打出這個手語 ✨<\/div>\n        <div class=\"ll-emoji\" id=\"ll-em\">🍎<\/div>\n        <div class=\"ll-word\" id=\"ll-wd\">蘋果<\/div>\n        <div class=\"ll-tip\">打對加分；打錯遊戲照常繼續，但這題不加分。<\/div>\n        <div class=\"ll-judge\">\n          <button class=\"ok\" onclick=\"judgeSign(true)\">✔ 打對了<\/button>\n          <button class=\"ng\" onclick=\"judgeSign(false)\">✘ 打錯了<\/button>\n        <\/div>\n        <div class=\"ll-keyhint\">快捷鍵：Y／Enter＝打對　N／Esc＝打錯<\/div>\n      <\/div>\n\n      <div id=\"ov\">\n        <h1>🐒 猴子射氣球<\/h1>\n        <p class=\"sub\">射中氣球，學習手語！<\/p>\n        <p style=\"color:#666;font-size:12px;margin-bottom:20px\">W / S / A / D 或 方向鍵 移動猴子 &nbsp;|&nbsp; 滑鼠點擊射飛鏢<\/p>\n        <div>\n          <button class=\"gbtn preview-btn\" onclick=\"openPreview()\">🃏 預習本次詞彙<\/button>\n          <button class=\"gbtn\" id=\"main-btn\" onclick=\"isWeaknessMode=false; startGame();\">直接開始遊戲<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  \n  <div id=\"panel\">\n    <div class=\"pt\">⚙️ 遊戲自訂控制面板<\/div>\n    <div class=\"ps\">\n      <div class=\"pl\">難度模式連動預設<\/div>\n      <select id=\"diff-sel\" onchange=\"applyDiff()\">\n        <option value=\"easy\">簡單模式 (慢速/長時/多命)<\/option>\n        <option value=\"normal\" selected>普通模式 (標準設定)<\/option>\n        <option value=\"hard\">困難模式 (快速/高壓挑戰)<\/option>\n        <option value=\"extreme\">極限模式 (一觸即死狂暴)<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"ps\">\n      <div class=\"rrow\"><span>氣球上升速度<\/span><span id=\"spd-val\" style=\"color:#fff;font-weight:700\">1.0x<\/span><\/div>\n      <input type=\"range\" id=\"spd-sl\" min=\"3\" max=\"35\" value=\"10\" oninput=\"updateSpeed(this.value)\">\n    <\/div>\n    <div class=\"ps\">\n      <div class=\"rrow\"><span>⏳ 遊戲時間限制<\/span><span id=\"tm-val\" style=\"color:#5B9FFF;font-weight:700\">60s<\/span><\/div>\n      <input type=\"range\" id=\"tm-sl\" min=\"10\" max=\"300\" value=\"60\" step=\"5\" oninput=\"updateTime(this.value)\">\n    <\/div>\n    <div class=\"ps\">\n      <div class=\"rrow\"><span>❤️ 猴子初始生命數<\/span><span id=\"lives-val\" style=\"color:#FF6B6B;font-weight:700\">3 個<\/span><\/div>\n      <input type=\"range\" id=\"lives-sl\" min=\"1\" max=\"10\" value=\"3\" step=\"1\" oninput=\"updateLivesCfg(this.value)\">\n    <\/div>\n    <div class=\"ps\">\n      <div class=\"rrow\"><span>🎈 每秒鐘氣球輸出總數<\/span><span id=\"bps-val\" style=\"color:#4BC97A;font-weight:700\">1.5 顆/秒<\/span><\/div>\n      <input type=\"range\" id=\"bps-sl\" min=\"0.5\" max=\"5.0\" value=\"1.5\" step=\"0.1\" oninput=\"updateBalloonRate(this.value)\">\n    <\/div>\n    <div class=\"ps\">\n      <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;cursor:pointer;user-select:none\">\n        <input type=\"checkbox\" id=\"show-text-cb\" checked onchange=\"toggleTextVisibility()\" style=\"width:auto;margin:0;accent-color:#FFD700\"> \n        顯示氣球中中文 (取消勾選即開啟盲測)\n      <\/label>\n    <\/div>\n    <div class=\"pt\" style=\"padding-top:10px\">🏆 組別對抗<\/div>\n    <div class=\"ps\">\n      <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;cursor:pointer;user-select:none\">\n        <input type=\"checkbox\" id=\"team-mode-cb\" onchange=\"toggleTeamMode()\" style=\"width:auto;margin:0;accent-color:#FFD700\">\n        啟用組別對抗（各組輪流上場，累計總分）\n      <\/label>\n      <div id=\"team-config\" style=\"display:none;margin-top:8px\">\n        <div class=\"rrow\"><span>參賽組數<\/span><span id=\"team-n-val\" style=\"color:#FFD700;font-weight:700\">3 組<\/span><\/div>\n        <input type=\"range\" id=\"team-n-sl\" min=\"2\" max=\"12\" value=\"3\" step=\"1\" oninput=\"updateTeamN(this.value)\">\n        <div class=\"rrow\"><span>每組上場局數<\/span><span id=\"team-r-val\" style=\"color:#5B9FFF;font-weight:700\">1 局<\/span><\/div>\n        <input type=\"range\" id=\"team-r-sl\" min=\"1\" max=\"5\" value=\"1\" step=\"1\" oninput=\"updateTeamR(this.value)\">\n        <div class=\"pl\" style=\"margin-top:6px\">組別名稱（可自訂）<\/div>\n        <div id=\"team-names\"><\/div>\n        <div class=\"pl\" id=\"team-room-lb\" style=\"margin-top:6px\">分組系統房間代碼（兩邊要相同）<\/div>\n        <input type=\"text\" id=\"team-room-in\" placeholder=\"default\" oninput=\"setTeamRoom(this.value)\">\n        <button class=\"pbtn\" onclick=\"importRoster()\">📥 從分組系統匯入組數與組員<\/button>\n        <p id=\"team-roster-note\" style=\"font-size:11px;color:#aaa;margin:4px 0 0;line-height:1.4\"><\/p>\n        <button class=\"pbtn\" onclick=\"publishTeamScores(true)\">📤 手動同步成績到分組系統<\/button>\n        <button class=\"pbtn\" onclick=\"startTeamMatch()\">🏁 開始對抗賽<\/button>\n        <button class=\"pbtn\" onclick=\"resetTeamMatch(true)\">↺ 重設對抗賽<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"pt\" style=\"padding-top:10px\">🖥️ 版面占比設定<\/div>\n    <div class=\"ps\">\n      <div class=\"rrow\"><span>遊戲區 : 控制面板<\/span><span id=\"lay-val\" style=\"color:#FFD700;font-weight:700\">--<\/span><\/div>\n      <input type=\"range\" id=\"lay-sl\" min=\"15\" max=\"50\" value=\"20\" step=\"1\" oninput=\"updateLayout(this.value)\">\n      <div class=\"rrow\" style=\"margin-top:6px\"><span>🃏 學習提示卡大小<\/span><span id=\"ll-val\" style=\"color:#5B9FFF;font-weight:700\">100%<\/span><\/div>\n      <input type=\"range\" id=\"ll-sl\" min=\"60\" max=\"160\" value=\"100\" step=\"5\" oninput=\"updateLLScale(this.value)\">\n      <div class=\"rrow\" style=\"margin-top:6px\"><span>面板顯示區塊<\/span><\/div>\n      <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;cursor:pointer;margin-bottom:3px\"><input type=\"checkbox\" id=\"sec-cat\" checked onchange=\"toggleSection()\" style=\"width:auto;margin:0\"> 類別篩選<\/label>\n      <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;cursor:pointer;margin-bottom:3px\"><input type=\"checkbox\" id=\"sec-stat\" checked onchange=\"toggleSection()\" style=\"width:auto;margin:0\"> 歷史數據統計<\/label>\n      <label style=\"display:flex;align-items:center;gap:6px;font-size:12px;color:#aaa;cursor:pointer\"><input type=\"checkbox\" id=\"sec-log\" checked onchange=\"toggleSection()\" style=\"width:auto;margin:0\"> 即時紀錄<\/label>\n      <button class=\"pbtn\" onclick=\"resetLayout()\">↺ 還原預設版面<\/button>\n    <\/div>\n    <div class=\"pt sec-cat\" style=\"padding-top:10px\">📁 出現詞彙類別篩選<\/div>\n    <div class=\"ps sec-cat\" style=\"border-bottom:none\"><div id=\"cat-wrap\"><\/div><\/div>\n    <div class=\"pt sec-stat\" style=\"padding-top:10px\">📊 歷史數據統計<\/div>\n    <div class=\"ps sec-stat\">\n      <div class=\"stat-grid\">\n        <div class=\"stat-cell\"><span class=\"stat-n\" id=\"st-games\">0<\/span><div class=\"stat-l\">總場次<\/div><\/div>\n        <div class=\"stat-cell\"><span class=\"stat-n\" id=\"st-hi\">0<\/span><div class=\"stat-l\">最高分<\/div><\/div>\n        <div class=\"stat-cell\"><span class=\"stat-n\" id=\"st-hits\">0<\/span><div class=\"stat-l\">命中數<\/div><\/div>\n        <div class=\"stat-cell\"><span class=\"stat-n\" id=\"st-esc\">0<\/span><div class=\"stat-l\">逃脫數<\/div><\/div>\n      <\/div>\n    <\/div>\n    <div class=\"pt sec-log\" style=\"padding-top:10px\">📋 即時紀錄<\/div>\n    <div id=\"log-box\" class=\"sec-log\"><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"admin-page\" class=\"page\">\n  <div class=\"admin-header\">\n    <div class=\"admin-title\">⚙️ 獨立後端詞彙資料庫管理系統<\/div>\n    <div style=\"font-size:16px; color:#dddddd; font-weight:700;\">目前詞彙總數：<span id=\"total-words-count\" style=\"color:#FFD700; font-size:20px;\">0<\/span><\/div>\n    <button class=\"abtn abtn-close\" onclick=\"switchPage('play')\">❌ 關閉後端並返回遊戲<\/button>\n  <\/div>\n  <div id=\"enabled-status-bar\" style=\"display:none; align-items:center; flex-wrap:wrap; gap:8px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:10px 16px; margin-bottom:16px; font-size:13px;\"><\/div>\n  \n  <div class=\"admin-grid\">\n    <div class=\"admin-left-panels\">\n      <div class=\"admin-box\">\n        <h3>📁 詞彙類別增減管理<\/h3>\n        <div class=\"form-group\" style=\"display:flex; gap:6px; margin-bottom:10px;\">\n          <input type=\"text\" id=\"new-cat-input\" placeholder=\"輸入要新增的類別名稱\">\n          <button class=\"abtn abtn-primary\" onclick=\"addCategory()\" style=\"padding:0 14px; flex-shrink:0;\">新增<\/button>\n        <\/div>\n        <div class=\"form-group\">\n          <label>目前已有類別清單 (點擊 ✖ 可刪除類別)：<\/label>\n          <div class=\"admin-cat-manage-list\" id=\"admin-cat-list\"><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"admin-box\">\n        <h3 id=\"form-title\">➕ 新增 / 修改詞彙<\/h3>\n        <input type=\"hidden\" id=\"edit-idx\" value=\"-1\">\n        <div class=\"form-group\">\n          <label>詞彙名稱<\/label>\n          <input type=\"text\" id=\"adm-word\" placeholder=\"例如：謝謝\">\n        <\/div>\n        <div class=\"form-group inline-grid\">\n          <div>\n            <label>表情圖示 (Emoji)<\/label>\n            <input type=\"text\" id=\"adm-emoji\" placeholder=\"🙏\">\n          <\/div>\n          <div>\n            <label>得分點數<\/label>\n            <input type=\"number\" id=\"adm-points\" value=\"5\" min=\"1\">\n          <\/div>\n        <\/div>\n        <div class=\"form-group\">\n          <label>選擇詞彙類別<\/label>\n          <select id=\"adm-cat\" class=\"adm-select-input\"><\/select>\n        <\/div>\n        <div style=\"margin-top:20px; display:flex; gap:10px;\">\n          <button class=\"abtn abtn-primary\" id=\"save-btn\" onclick=\"saveWord()\" style=\"flex:1; padding:12px;\">儲存變更<\/button>\n          <button class=\"abtn\" id=\"cancel-btn\" onclick=\"resetAdminForm()\" style=\"display:none;\">取消編輯<\/button>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"admin-box\" style=\"background:transparent; border:none; padding:0;\">\n      <div class=\"overview-head\">\n        <h3 class=\"overview-title\" id=\"overview-title\" onclick=\"toggleOverview()\" style=\"border-bottom:none; font-size:20px; color:#ffffff;\">\n          <span class=\"cat-arrow\" id=\"overview-arrow\" style=\"font-size:14px;\">▼<\/span>📋 詞彙分類總覽\n        <\/h3>\n        <div class=\"overview-tools\" id=\"overview-tools\">\n          <button class=\"abtn abtn-close\" onclick=\"setAllCategories(false)\">全部展開<\/button>\n          <button class=\"abtn abtn-close\" onclick=\"setAllCategories(true)\">全部收合<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"category-container-list\" id=\"category-box-list\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"batch-toolbar\">\n    <div class=\"batch-info\">已選取 <span id=\"batch-count\">0<\/span> 個詞彙<\/div>\n    <div class=\"batch-actions\">\n      <span style=\"font-size: 13px; color: #aaa;\">批量搬移至：<\/span>\n      <select id=\"batch-move-cat\" style=\"width: 140px; margin-bottom: 0; padding: 4px 8px;\"><\/select>\n      <button class=\"abtn abtn-edit\" onclick=\"batchMoveCategory()\" style=\"margin-right: 15px;\">執行搬移<\/button>\n      <button class=\"abtn\" style=\"background:#4CAF50;color:#fff;\" onclick=\"applySelectedToGame()\">✅ 套用選取詞彙進入遊戲<\/button>\n      <button class=\"abtn abtn-danger\" onclick=\"batchDeleteWords()\">🗑️ 批量刪除選取項<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst cv = document.getElementById('cv');\nconst ctx = cv.getContext('2d');\nlet W, H;\n\nfunction resize() {\n  const wrap = document.getElementById('cv-wrap');\n  if(!wrap) return;\n  W = wrap.clientWidth || window.innerWidth - 260; // 備用安全寬度\n  H = wrap.clientHeight || window.innerHeight - 50; // 備用安全高度\n  cv.width = W;\n  cv.height = H;\n}\n\n// 首次加載與監聽\nresize();\nwindow.addEventListener('resize', resize);\n// 增加安全延遲，防止某些瀏覽器載入時 DOM 元件尚未穩定計算完畢\nsetTimeout(resize, 100);\n\nconst DEFAULT_WORDS = [\n  {word:'蘋果',emoji:'🍎',category:'食物',points:10},\n  {word:'香蕉',emoji:'🍌',category:'食物',points:10},\n  {word:'水',emoji:'💧',category:'食物',points:10},\n  {word:'你好',emoji:'👋',category:'問候',points:15},\n  {word:'謝謝',emoji:'🙏',category:'問候',points:15},\n  {word:'再見',emoji:'✌️',category:'問候',points:15},\n  {word:'對不起',emoji:'🙇',category:'問候',points:18},\n  {word:'愛',emoji:'❤️',category:'情感',points:20},\n  {word:'快樂',emoji:'😊',category:'情感',points:18},\n  {word:'悲傷',emoji:'😢',category:'情感',points:18},\n  {word:'太陽',emoji:'☀️',category:'自然',points:10},\n  {word:'月亮',emoji:'🌙',category:'自然',points:10},\n  {word:'花',emoji:'🌸',category:'自然',points:10},\n  {word:'星星',emoji:'⭐',category:'自然',points:12},\n  {word:'彩虹',emoji:'🌈',category:'自然',points:20},\n  {word:'貓',emoji:'🐱',category:'動物',points:12},\n  {word:'狗',emoji:'🐶',category:'動物',points:12},\n  {word:'魚',emoji:'🐟',category:'動物',points:12},\n  {word:'書',emoji:'📚',category:'學習',points:15},\n  {word:'學校',emoji:'🏫',category:'學習',points:15},\n  {word:'家',emoji:'🏠',category:'日常',points:12},\n  {word:'跑步',emoji:'🏃',category:'動作',points:20},\n  {word:'吃飯',emoji:'🍚',category:'動作',points:15},\n  {word:'睡覺',emoji:'😴',category:'動作',points:15},\n  {word:'音樂',emoji:'🎵',category:'藝術',points:18},\n  {word:'朋友',emoji:'🤝',category:'社交',points:20},\n  {word:'數字1',emoji:'☝️',category:'數字',points:8},\n  {word:'數字2',emoji:'✌️',category:'數字',points:8},\n  {word:'數字3',emoji:'🤟',category:'數字',points:8},\n  {word:'飛機',emoji:'✈️',category:'交通',points:15},\n];\nconst DEFAULT_CATEGORIES = ['食物', '問候', '情感', '自然', '動物', '學習', '日常', '動作', '藝術', '社交', '數字', '交通', '未分類'];\n\nlet ALL_WORDS = JSON.parse(localStorage.getItem('sf_words')) || DEFAULT_WORDS;\nlet SYSTEM_CATEGORIES = JSON.parse(localStorage.getItem('sf_categories')) || DEFAULT_CATEGORIES;\nlet stats = JSON.parse(localStorage.getItem('sf_stats')) || { games:0, hi:0, hits:0, esc:0 };\n\nlet activeCategories = new Set();\nlet currentSessionMissed = new Set();\nlet isWeaknessMode = false;\nlet isHitPaused = false; \n\nlet selectedWordIndexes = new Set();\nlet enabledWordIndexes = JSON.parse(localStorage.getItem('sf_enabled_indexes')) || null;\n\n// ── 雲端同步狀態指示器 ──\n(function createSyncIndicator() {\n  const el = document.createElement('div');\n  el.id = 'sync-indicator';\n  el.style.cssText = 'position:fixed;bottom:10px;left:10px;z-index:9999;font-size:11px;font-family:Nunito,sans-serif;font-weight:700;padding:4px 10px;border-radius:20px;transition:all .3s;pointer-events:none;';\n  el.textContent = '☁️ 連線中...';\n  el.style.background = 'rgba(91,159,255,0.2)';\n  el.style.color = '#5B9FFF';\n  el.style.border = '1px solid rgba(91,159,255,0.4)';\n  document.body.appendChild(el);\n})();\n\nfunction setSyncStatus(status) {\n  const el = document.getElementById('sync-indicator');\n  if (!el) return;\n  if (status === 'saving') {\n    el.textContent = '☁️ 同步中...';\n    el.style.background = 'rgba(255,215,0,0.15)'; el.style.color = '#FFD700'; el.style.border = '1px solid rgba(255,215,0,0.3)';\n  } else if (status === 'saved') {\n    el.textContent = '✅ 雲端已同步';\n    el.style.background = 'rgba(76,175,80,0.15)'; el.style.color = '#4CAF50'; el.style.border = '1px solid rgba(76,175,80,0.3)';\n    setTimeout(() => setSyncStatus('idle'), 2500);\n  } else if (status === 'error') {\n    el.textContent = '⚠️ 雲端同步失敗（已存本地）';\n    el.style.background = 'rgba(255,107,107,0.15)'; el.style.color = '#FF6B6B'; el.style.border = '1px solid rgba(255,107,107,0.3)';\n  } else {\n    el.textContent = '☁️ 雲端已連線';\n    el.style.background = 'rgba(76,175,80,0.08)'; el.style.color = '#4CAF50'; el.style.border = '1px solid rgba(76,175,80,0.2)';\n  }\n}\n\n// ── 資料儲存（本地 + 雲端） ──\nfunction saveToLocalStorage() {\n  // 1. 永遠先存本地，確保離線也能用\n  localStorage.setItem('sf_words', JSON.stringify(ALL_WORDS));\n  localStorage.setItem('sf_categories', JSON.stringify(SYSTEM_CATEGORIES));\n  localStorage.setItem('sf_stats', JSON.stringify(stats));\n  if (enabledWordIndexes !== null) {\n    localStorage.setItem('sf_enabled_indexes', JSON.stringify(enabledWordIndexes));\n  } else {\n    localStorage.removeItem('sf_enabled_indexes');\n  }\n  // 2. 非同步推送到 Firebase\n  saveToFirebase();\n}\n\nasync function saveToFirebase() {\n  if (!window._fbReady) return;\n  setSyncStatus('saving');\n  try {\n    const db = window._fbDb, fbRef = window._fbRef, fbSet = window._fbSet;\n    const payload = {\n      words: ALL_WORDS,\n      categories: SYSTEM_CATEGORIES,\n      stats: stats,\n      enabledIndexes: enabledWordIndexes !== null ? enabledWordIndexes : null,\n      lastUpdated: Date.now()\n    };\n    await fbSet(fbRef(db, 'gameData'), payload);\n    setSyncStatus('saved');\n  } catch (e) {\n    console.warn('Firebase 同步失敗：', e);\n    setSyncStatus('error');\n  }\n}\n\n// ── 從 Firebase 載入資料（頁面初始化時） ──\nasync function loadFromFirebase() {\n  if (!window._fbReady) return;\n  try {\n    const db = window._fbDb, fbRef = window._fbRef, fbGet = window._fbGet;\n    const snapshot = await fbGet(fbRef(db, 'gameData'));\n    if (snapshot.exists()) {\n      const data = snapshot.val();\n      if (Array.isArray(data.words) && data.words.length > 0) {\n        ALL_WORDS = data.words;\n        localStorage.setItem('sf_words', JSON.stringify(ALL_WORDS));\n      }\n      if (Array.isArray(data.categories) && data.categories.length > 0) {\n        SYSTEM_CATEGORIES = data.categories;\n        localStorage.setItem('sf_categories', JSON.stringify(SYSTEM_CATEGORIES));\n      }\n      if (data.stats) {\n        stats = data.stats;\n        localStorage.setItem('sf_stats', JSON.stringify(stats));\n      }\n      enabledWordIndexes = data.enabledIndexes || null;\n      if (enabledWordIndexes !== null) {\n        localStorage.setItem('sf_enabled_indexes', JSON.stringify(enabledWordIndexes));\n      } else {\n        localStorage.removeItem('sf_enabled_indexes');\n      }\n      // 更新 UI\n      rebuildCategoryPills();\n      updStats();\n      setSyncStatus('idle');\n      addLog('sys', '☁️ 已從雲端同步最新詞彙資料庫');\n    } else {\n      // Firebase 是空的，把本地資料推上去\n      await saveToFirebase();\n      addLog('sys', '☁️ 已將本地資料初始化上傳至雲端');\n    }\n  } catch (e) {\n    console.warn('Firebase 讀取失敗，使用本地資料：', e);\n    setSyncStatus('error');\n  }\n}\n\n// 等待 Firebase 就緒後載入雲端資料\nif (window._fbReady) {\n  loadFromFirebase();\n} else {\n  document.addEventListener('firebaseReady', loadFromFirebase);\n}\n\nfunction switchPage(pageId) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  if(pageId === 'admin') {\n    if(game.running && !cfg.paused) togglePause();\n    document.getElementById('admin-page').classList.add('active');\n    selectedWordIndexes.clear();\n    renderAdminTable();\n  } else {\n    document.getElementById('play-page').classList.add('active');\n    resize();\n  }\n}\n\nfunction rebuildCategoryPills() {\n  const catWrap = document.getElementById('cat-wrap');\n  if(!catWrap) return;\n  catWrap.innerHTML = '';\n  const usedCats = SYSTEM_CATEGORIES.filter(c => ALL_WORDS.some(w => w.category === c));\n  const oldActive = new Set(activeCategories);\n  activeCategories.clear();\n  \n  usedCats.forEach(c => {\n    if (oldActive.size === 0 || oldActive.has(c)) {\n      activeCategories.add(c);\n    }\n    const p = document.createElement('span');\n    p.className = 'cat-pill' + (activeCategories.has(c) ? ' on' : '');\n    p.textContent = c;\n    p.onclick = () => {\n      if(isWeaknessMode) {\n        isWeaknessMode = false;\n        addLog('sys', '已手動切換類別，自動離開弱點特訓模式。');\n      }\n      if (activeCategories.has(c)) {\n        if (activeCategories.size <= 1) return;\n        activeCategories.delete(c);\n        p.classList.remove('on');\n      } else {\n        activeCategories.add(c);\n        p.classList.add('on');\n      }\n    };\n    catWrap.appendChild(p);\n  });\n}\n\nfunction addCategory() {\n  const input = document.getElementById('new-cat-input');\n  const catName = input.value.trim();\n  if(!catName) { alert('請輸入類別名稱！'); return; }\n  if(SYSTEM_CATEGORIES.includes(catName)) { alert('此類別已存在！'); return; }\n  SYSTEM_CATEGORIES.push(catName);\n  input.value = '';\n  addLog('sys', `新增類別：「${catName}」`);\n  saveToLocalStorage();\n  renderAdminTable();\n}\n\nfunction deleteCategory(catName) {\n  if(catName === '未分類') { alert('「未分類」為系統核心預留空間，不可刪除！'); return; }\n  const linkedWords = ALL_WORDS.filter(w => w.category === catName);\n  let confirmMsg = `確定要刪除「${catName}」類別嗎？`;\n  if(linkedWords.length > 0) {\n    confirmMsg = `「${catName}」類別內目前包含 ${linkedWords.length} 個單字，若刪除該類別，這些單字將會自動被歸類到【未分類】中。\\n\\n確認移除此類別嗎？`;\n  }\n  if(confirm(confirmMsg)) {\n    ALL_WORDS.forEach(w => { if(w.category === catName) w.category = '未分類'; });\n    SYSTEM_CATEGORIES = SYSTEM_CATEGORIES.filter(c => c !== catName);\n    addLog('sys', `刪下了類別：「${catName}」`);\n    selectedWordIndexes.clear();\n    saveToLocalStorage();\n    renderAdminTable();\n  }\n}\n\nlet collapsedCats = new Set();\nlet overviewCollapsed = false;\ntry {\n  collapsedCats = new Set(JSON.parse(localStorage.getItem('adm_collapsed_cats') || '[]'));\n  overviewCollapsed = localStorage.getItem('adm_overview_collapsed') === '1';\n} catch(e) {}\n\nfunction saveCollapseState() {\n  try {\n    localStorage.setItem('adm_collapsed_cats', JSON.stringify([...collapsedCats]));\n    localStorage.setItem('adm_overview_collapsed', overviewCollapsed ? '1' : '0');\n  } catch(e) {}\n}\n\nfunction applyOverviewState() {\n  const list = document.getElementById('category-box-list');\n  const arrow = document.getElementById('overview-arrow');\n  const tools = document.getElementById('overview-tools');\n  if (list) list.style.display = overviewCollapsed ? 'none' : '';\n  if (tools) tools.style.display = overviewCollapsed ? 'none' : '';\n  if (arrow) arrow.style.transform = overviewCollapsed ? 'rotate(-90deg)' : '';\n}\n\nfunction toggleOverview() {\n  overviewCollapsed = !overviewCollapsed;\n  applyOverviewState();\n  saveCollapseState();\n}\n\nfunction toggleCategoryCard(catName) {\n  if (collapsedCats.has(catName)) collapsedCats.delete(catName);\n  else collapsedCats.add(catName);\n  saveCollapseState();\n  renderAdminTable();\n}\n\nfunction setAllCategories(collapse) {\n  collapsedCats = collapse ? new Set(SYSTEM_CATEGORIES) : new Set();\n  saveCollapseState();\n  renderAdminTable();\n}\n\nfunction renderAdminTable() {\n  const containerList = document.getElementById('category-box-list');\n  const totalCountEl = document.getElementById('total-words-count');\n  const selectDropdown = document.getElementById('adm-cat');\n  const batchSelectDropdown = document.getElementById('batch-move-cat');\n  const catListWrap = document.getElementById('admin-cat-list');\n  \n  if(!containerList) return;\n  containerList.innerHTML = '';\n  totalCountEl.textContent = ALL_WORDS.length;\n  \n  catListWrap.innerHTML = SYSTEM_CATEGORIES.map(c => `\n    <span class=\"admin-cat-tag\">\n      ${c}\n      ${c !== '未分類' ? `<button class=\"admin-cat-del-btn\" onclick=\"deleteCategory('${c}')\" title=\"刪除此類別\">✖<\/button>` : ''}\n    <\/span>\n  `).join('');\n\n  const prevSelected = selectDropdown.value;\n  selectDropdown.innerHTML = SYSTEM_CATEGORIES.map(c => `<option value=\"${c}\">${c}<\/option>`).join('');\n  if (SYSTEM_CATEGORIES.includes(prevSelected)) selectDropdown.value = prevSelected;\n\n  batchSelectDropdown.innerHTML = SYSTEM_CATEGORIES.map(c => `<option value=\"${c}\">${c}<\/option>`).join('');\n\n  SYSTEM_CATEGORIES.forEach(catName => {\n    const catWords = ALL_WORDS.map((w, idx) => ({ ...w, originalIndex: idx })).filter(w => w.category === catName);\n    if(catWords.length === 0 && catName === '未分類') return; \n\n    const isAllGroupChecked = catWords.length > 0 && catWords.every(item => selectedWordIndexes.has(item.originalIndex));\n\n    const card = document.createElement('div');\n    card.className = 'category-card-box' + (collapsedCats.has(catName) ? ' collapsed' : '');\n    card.innerHTML = `\n      <div class=\"category-card-header\" title=\"點擊展開／收合\">\n        <div class=\"category-card-title\"><span class=\"cat-arrow\">▼<\/span>📁 類別：${catName}<\/div>\n        <div class=\"category-card-badge\">共 ${catWords.length} 個單字<\/div>\n      <\/div>\n      <div class=\"category-card-body\">\n      <table class=\"word-table\">\n        <thead>\n          <tr>\n            <th style=\"width: 35px; text-align: center;\">\n              <input type=\"checkbox\" class=\"adm-box-cb\" ${isAllGroupChecked ? 'checked' : ''} onclick=\"toggleSelectGroup('${catName}', this.checked)\">\n            <\/th>\n            <th style=\"width: 50px\">圖示<\/th>\n            <th>詞彙名稱<\/th>\n            <th style=\"width: 60px\">分數<\/th>\n            <th style=\"width: 120px; text-align: center\">操作<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody id=\"tbody-cat-${catName}\"><\/tbody>\n      <\/table>\n      ${catWords.length === 0 ? `<div style=\"color:#888; font-size:12px; padding:10px; text-align:center;\">此類別內目前尚無詞彙單字<\/div>` : ''}\n      <\/div>\n    `;\n    card.querySelector('.category-card-header').addEventListener('click', () => toggleCategoryCard(catName));\n    containerList.appendChild(card);\n    \n    const tbody = document.getElementById(`tbody-cat-${catName}`);\n    if(tbody) {\n      catWords.forEach(item => {\n        const isChecked = selectedWordIndexes.has(item.originalIndex);\n        const isEnabled = enabledWordIndexes !== null && enabledWordIndexes.includes(item.originalIndex);\n        const tr = document.createElement('tr');\n        tr.innerHTML = `\n          <td style=\"text-align: center;\">\n            <input type=\"checkbox\" class=\"adm-box-cb word-item-cb\" data-idx=\"${item.originalIndex}\" ${isChecked ? 'checked' : ''} onchange=\"toggleSelectWord(${item.originalIndex}, this.checked)\">\n          <\/td>\n          <td style=\"font-size:22px\">${item.emoji}<\/td>\n          <td style=\"font-weight:700; color:#ffffff;\">${item.word} ${isEnabled ? '<span style=\"font-size:10px;color:#4CAF50;background:rgba(76,175,80,0.15);padding:1px 6px;border-radius:8px;margin-left:4px;\">✅ 遊戲中<\/span>' : ''}<\/td>\n          <td><span style=\"color:#FFD700; font-weight:700\">${item.points}<\/span><\/td>\n          <td style=\"text-align: center\">\n            <button class=\"abtn abtn-edit\" onclick=\"startEditWord(${item.originalIndex})\">修改<\/button>\n            <button class=\"abtn abtn-danger\" onclick=\"deleteWord(${item.originalIndex})\">刪除<\/button>\n          <\/td>\n        `;\n        tbody.appendChild(tr);\n      });\n    }\n  });\n  applyOverviewState();\n  updateBatchToolbar();\n  rebuildCategoryPills();\n  updateEnabledStatus();\n}\n\nfunction toggleSelectWord(idx, isChecked) {\n  if (isChecked) {\n    selectedWordIndexes.add(idx);\n  } else {\n    selectedWordIndexes.delete(idx);\n  }\n  updateBatchToolbar();\n}\n\nfunction toggleSelectGroup(catName, isChecked) {\n  ALL_WORDS.forEach((w, idx) => {\n    if (w.category === catName) {\n      if (isChecked) {\n        selectedWordIndexes.add(idx);\n      } else {\n        selectedWordIndexes.delete(idx);\n      }\n    }\n  });\n  renderAdminTable();\n}\n\nfunction updateBatchToolbar() {\n  const toolbar = document.getElementById('batch-toolbar');\n  const countEl = document.getElementById('batch-count');\n  \n  if (selectedWordIndexes.size > 0) {\n    countEl.textContent = selectedWordIndexes.size;\n    toolbar.style.display = 'flex';\n  } else {\n    toolbar.style.display = 'none';\n  }\n}\n\nfunction batchMoveCategory() {\n  const targetCat = document.getElementById('batch-move-cat').value;\n  if (!targetCat) return;\n\n  if (confirm(`確定要將選取的 ${selectedWordIndexes.size} 個詞彙一鍵搬移至「${targetCat}」嗎？`)) {\n    ALL_WORDS.forEach((w, idx) => {\n      if (selectedWordIndexes.has(idx)) {\n        w.category = targetCat;\n      }\n    });\n    addLog('sys', `後台執行批量操作：搬移 ${selectedWordIndexes.size} 個詞彙至【${targetCat}】`);\n    selectedWordIndexes.clear();\n    saveToLocalStorage();\n    renderAdminTable();\n  }\n}\n\nfunction batchDeleteWords() {\n  if (selectedWordIndexes.size >= ALL_WORDS.length) {\n    alert('系統保護：不可刪除全部單字，詞彙庫至少需要保留一個單字！');\n    return;\n  }\n\n  if (confirm(`⚠️ 警報！您正準備一次刪除 ${selectedWordIndexes.size} 個單字，此操作無法復原！\\n\\n確認要永久刪除這些詞彙嗎？`)) {\n    const sortedIndexes = Array.from(selectedWordIndexes).sort((a, b) => b - a);\n    sortedIndexes.forEach(idx => {\n      ALL_WORDS.splice(idx, 1);\n    });\n    \n    addLog('sys', `後台執行批量操作：永久刪下了 ${selectedWordIndexes.size} 個詞彙`);\n    selectedWordIndexes.clear();\n    resetAdminForm();\n    saveToLocalStorage();\n    renderAdminTable();\n  }\n}\n\nfunction applySelectedToGame() {\n  if (selectedWordIndexes.size === 0) {\n    alert('請先勾選至少一個詞彙！');\n    return;\n  }\n  enabledWordIndexes = Array.from(selectedWordIndexes);\n  saveToLocalStorage();\n  addLog('sys', `✅ 已設定 ${enabledWordIndexes.length} 個詞彙專屬進入遊戲（預習本同步更新）`);\n  updateEnabledStatus();\n  alert(`✅ 完成！已將勾選的 ${enabledWordIndexes.length} 個詞彙設定為本局遊戲詞彙。\\n預習本也會同步顯示這些詞彙。`);\n}\n\nfunction clearEnabledWords() {\n  enabledWordIndexes = null;\n  saveToLocalStorage();\n  addLog('sys', '🔄 已清除專屬詞彙設定，恢復使用類別篩選模式。');\n  updateEnabledStatus();\n}\n\nfunction updateEnabledStatus() {\n  const el = document.getElementById('enabled-status-bar');\n  if (!el) return;\n  if (enabledWordIndexes !== null && enabledWordIndexes.length > 0) {\n    const validWords = enabledWordIndexes.filter(idx => idx < ALL_WORDS.length).map(idx => ALL_WORDS[idx]);\n    el.style.display = 'flex';\n    el.innerHTML = `<span style=\"color:#4CAF50;font-weight:900;\">✅ 遊戲模式：已指定 <b style=\"font-size:18px;\">${validWords.length}<\/b> 個詞彙進入遊戲<\/span>\n      <span style=\"color:#aaa;font-size:12px;margin-left:8px;\">${validWords.map(w=>w.emoji+w.word).join('、')}<\/span>\n      <button class=\"abtn abtn-danger\" onclick=\"clearEnabledWords()\" style=\"margin-left:16px;padding:4px 12px;flex-shrink:0;\">🔄 清除，恢復類別模式<\/button>`;\n  } else {\n    el.style.display = 'flex';\n    el.innerHTML = `<span style=\"color:#888;\">📂 遊戲模式：依「類別篩選」選取詞彙（預設）<\/span>`;\n  }\n}\n\nfunction saveWord() {\n  const wEl = document.getElementById('adm-word');\n  const eEl = document.getElementById('adm-emoji');\n  const pEl = document.getElementById('adm-points');\n  const cEl = document.getElementById('adm-cat');\n  const editIdx = parseInt(document.getElementById('edit-idx').value);\n\n  const word = wEl.value.trim();\n  const emoji = eEl.value.trim() || '🎈';\n  const points = parseInt(pEl.value) || 10;\n  const category = cEl.value;\n\n  if(!word) { alert('請填寫詞彙名稱！'); return; }\n\n  if(editIdx === -1) {\n    ALL_WORDS.push({ word, emoji, category, points });\n    addLog('sys', `後台新增詞彙：「${word}」【${category}】`);\n  } else {\n    const oldName = ALL_WORDS[editIdx].word;\n    ALL_WORDS[editIdx] = { word, emoji, category, points };\n    addLog('sys', `後台將「${oldName}」修改為：「${word}」【${category}】`);\n  }\n  selectedWordIndexes.clear();\n  resetAdminForm();\n  saveToLocalStorage();\n  renderAdminTable();\n}\n\nfunction startEditWord(idx) {\n  const item = ALL_WORDS[idx];\n  document.getElementById('adm-word').value = item.word;\n  document.getElementById('adm-emoji').value = item.emoji;\n  document.getElementById('adm-points').value = item.points;\n  document.getElementById('adm-cat').value = item.category;\n  document.getElementById('edit-idx').value = idx;\n  document.getElementById('form-title').textContent = '📝 正在修改詞彙';\n  document.getElementById('cancel-btn').style.display = 'inline-block';\n  document.getElementById('save-btn').textContent = '更新資料';\n}\n\nfunction deleteWord(idx) {\n  if(ALL_WORDS.length <= 1) { alert('詞彙庫至少需要保留一個詞彙！'); return; }\n  const deletedWord = ALL_WORDS[idx].word;\n  if(confirm(`確認要刪除「${deletedWord}」嗎？`)) {\n    ALL_WORDS.splice(idx, 1);\n    addLog('sys', `後台刪下了詞彙：「${deletedWord}」`);\n    selectedWordIndexes.clear();\n    resetAdminForm();\n    saveToLocalStorage();\n    renderAdminTable();\n  }\n}\n\nfunction resetAdminForm() {\n  document.getElementById('adm-word').value = '';\n  document.getElementById('adm-emoji').value = '';\n  document.getElementById('adm-points').value = '5';\n  document.getElementById('edit-idx').value = '-1';\n  document.getElementById('form-title').textContent = '➕ 新增 / 修改詞彙';\n  document.getElementById('cancel-btn').style.display = 'none';\n  document.getElementById('save-btn').textContent = '儲存變更';\n}\n\nlet showBalloonText = true;\nfunction toggleTextVisibility() {\n  showBalloonText = document.getElementById('show-text-cb').checked;\n  addLog('sys', showBalloonText ? '🟢 已開啟氣球文字顯示' : '👁️ 已隱藏氣球文字（進入盲測挑戰模式！）');\n}\n\nfunction getWords() { \n  if (isWeaknessMode && currentSessionMissed.size > 0) {\n    return ALL_WORDS.filter(w => currentSessionMissed.has(w.word));\n  }\n  if (enabledWordIndexes !== null && enabledWordIndexes.length > 0) {\n    return enabledWordIndexes\n      .filter(idx => idx < ALL_WORDS.length)\n      .map(idx => ALL_WORDS[idx]);\n  }\n  return ALL_WORDS.filter(w => activeCategories.has(w.category)); \n}\n\nlet cfg = { spd: 1.0, timeLimit: 60, maxLives: 3, spawnRate: 55, balloonsPerSecond: 1.5, paused: false };\nconst DIFFS = {\n  easy: { spd:0.65, timeLimit:90, maxLives:5, spawnRate:80 },\n  normal: { spd:1.0, timeLimit:60, maxLives:3, spawnRate:55 },\n  hard: { spd:1.5, timeLimit:60, maxLives:2, spawnRate:35 },\n  extreme: { spd:2.2, timeLimit:45, maxLives:1, spawnRate:22 },\n};\nfunction applyDiff() {\n  const d = document.getElementById('diff-sel').value;\n  const p = DIFFS[d];\n  cfg.spd = p.spd; cfg.timeLimit = p.timeLimit; cfg.maxLives = p.maxLives; cfg.spawnRate = p.spawnRate;\n  document.getElementById('spd-sl').value = Math.round(p.spd * 10);\n  document.getElementById('spd-val').textContent = p.spd.toFixed(1) + 'x';\n  document.getElementById('tm-sl').value = p.timeLimit;\n  document.getElementById('tm-val').textContent = p.timeLimit + 's';\n  document.getElementById('lives-sl').value = p.maxLives;\n  document.getElementById('lives-val').textContent = p.maxLives + ' 個';\n  addLog('sys', `難度設為「${d}」（時間及生命值已同步更新）`);\n}\nfunction updateSpeed(v) { cfg.spd = Math.round(v) / 10; document.getElementById('spd-val').textContent = cfg.spd.toFixed(1) + 'x'; }\nfunction updateTime(v) { cfg.timeLimit = parseInt(v); document.getElementById('tm-val').textContent = v + 's'; }\nfunction updateLivesCfg(v) { cfg.maxLives = parseInt(v); document.getElementById('lives-val').textContent = v + ' 個'; }\nfunction updateBalloonRate(v) { cfg.balloonsPerSecond = parseFloat(v); document.getElementById('bps-val').textContent = cfg.balloonsPerSecond.toFixed(1) + ' 顆/秒'; }\n\n// ── 版面占比控制 ──\nconst LAYOUT_KEY = 'monkeyBalloonLayout';\nfunction saveLayout() {\n  try {\n    localStorage.setItem(LAYOUT_KEY, JSON.stringify({\n      panel: document.getElementById('lay-sl').value,\n      ll: document.getElementById('ll-sl').value,\n      cat: document.getElementById('sec-cat').checked,\n      stat: document.getElementById('sec-stat').checked,\n      log: document.getElementById('sec-log').checked\n    }));\n  } catch(e) {}\n}\nfunction updateLayout(v, noSave) {\n  v = parseInt(v);\n  document.getElementById('lay-sl').value = v;\n  document.documentElement.style.setProperty('--panel-w', v + 'vw');\n  document.getElementById('lay-val').textContent = (100 - v) + '% : ' + v + '%';\n  resize();\n  if (!noSave) saveLayout();\n}\nfunction updateLLScale(v, noSave) {\n  v = parseInt(v);\n  document.getElementById('ll-sl').value = v;\n  document.documentElement.style.setProperty('--ll-scale', v / 100);\n  document.getElementById('ll-val').textContent = v + '%';\n  if (!noSave) saveLayout();\n}\nfunction toggleSection(noSave) {\n  [['cat','sec-cat'],['stat','sec-stat'],['log','sec-log']].forEach(([k,id]) => {\n    const on = document.getElementById(id).checked;\n    document.querySelectorAll('.' + id).forEach(el => el.style.display = on ? '' : 'none');\n  });\n  if (noSave !== true) saveLayout();\n}\nfunction resetLayout() {\n  document.documentElement.style.removeProperty('--panel-w');\n  document.documentElement.style.removeProperty('--ll-scale');\n  ['sec-cat','sec-stat','sec-log'].forEach(id => document.getElementById(id).checked = true);\n  try { localStorage.removeItem(LAYOUT_KEY); } catch(e) {}\n  toggleSection(true);\n  updateLLScale(100, true);\n  initLayoutUI();\n  resize();\n}\nfunction initLayoutUI() {\n  const pw = document.getElementById('panel').getBoundingClientRect().width;\n  const pct = Math.min(50, Math.max(15, Math.round(pw / window.innerWidth * 100)));\n  document.getElementById('lay-sl').value = pct;\n  document.getElementById('lay-val').textContent = (100 - pct) + '% : ' + pct + '%';\n}\n(function restoreLayout() {\n  let saved = null;\n  try { saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null'); } catch(e) {}\n  if (saved) {\n    updateLayout(saved.panel, true);\n    updateLLScale(saved.ll, true);\n    document.getElementById('sec-cat').checked = saved.cat !== false;\n    document.getElementById('sec-stat').checked = saved.stat !== false;\n    document.getElementById('sec-log').checked = saved.log !== false;\n    toggleSection(true);\n  } else {\n    initLayoutUI();\n  }\n  window.addEventListener('resize', initLayoutUI_ifDefault);\n  function initLayoutUI_ifDefault() {\n    if (!document.documentElement.style.getPropertyValue('--panel-w')) initLayoutUI();\n  }\n})();\n\nfunction updStats() {\n  document.getElementById('st-games').textContent = stats.games;\n  document.getElementById('st-hi').textContent = stats.hi;\n  document.getElementById('st-hits').textContent = stats.hits;\n  document.getElementById('st-esc').textContent = stats.esc;\n}\nfunction addLog(type, msg) {\n  const box = document.getElementById('log-box');\n  if(!box) return;\n  const r = document.createElement('div');\n  r.className = 'log-row';\n  const tags = {hit:'[擊中]',esc:'[逃脫]',end:'[結束]',sys:'[系統]'};\n  const tagCls = {hit:'tag-hit',esc:'tag-esc',end:'tag-end',sys:'tag-sys'};\n  r.innerHTML = `<span class=\"tag ${tagCls[type]||''}\">${tags[type]||''}<\/span>${msg}`;\n  box.prepend(r);\n  while (box.children.length > 40) box.removeChild(box.lastChild);\n}\n\nconst game = { running:false, over:false, score:0, combo:1, comboT:0, lives:3, timeLeft:60, spawnAcc:0 };\nconst monkey = { x:0, y:0, speed:4.5, facing:1, arm:0, armDir:1, shootT:0 };\nlet balloons=[], darts=[], particles=[], floats=[];\nlet raf, tickInt;\nconst keys = {};\n\nlet currentPreviewWords = [];\n\nfunction openPreview() {\n  let wordsToPreview;\n  const header = document.querySelector('.preview-header p');\n\n  if (enabledWordIndexes !== null && enabledWordIndexes.length > 0) {\n    wordsToPreview = enabledWordIndexes\n      .filter(idx => idx < ALL_WORDS.length)\n      .map(idx => ALL_WORDS[idx]);\n    if (header) header.textContent = `✅ 顯示後台指定的 ${wordsToPreview.length} 個詞彙，點擊卡牌或使用下方工具列切換！`;\n  } else {\n    wordsToPreview = ALL_WORDS.filter(w => activeCategories.has(w.category));\n    if (header) header.textContent = `點擊個別卡牌或使用下方工具列一鍵切換，配合手語教材進行記憶預習吧！`;\n  }\n\n  currentPreviewWords = wordsToPreview;\n  const grid = document.getElementById('preview-card-grid');\n  grid.innerHTML = '';\n  \n  if (wordsToPreview.length === 0) {\n    grid.innerHTML = `<div style=\"color:#FF6B6B; font-weight:700; grid-column:1/-1; text-align:center; padding:20px;\">⚠️ 目前沒有任何詞彙可預習，請先至管理後台勾選詞彙或開啟類別！<\/div>`;\n  } else {\n    wordsToPreview.forEach(w => {\n      const card = document.createElement('div');\n      card.className = 'flashcard';\n      card.innerHTML = `\n        <span class=\"c-cat\">${w.category}<\/span>\n        <span class=\"c-emoji\">${w.emoji}<\/span>\n        <span class=\"c-word\">${w.word}<\/span>\n      `;\n      card.onclick = () => { card.classList.toggle('flipped'); };\n      grid.appendChild(card);\n    });\n  }\n  document.getElementById('preview-overlay').style.display = 'flex';\n}\n\n// 📄 匯出可列印的卡片 PDF（A4 直式，一列 7 張，自動分頁）\nfunction exportCardsImage(showWord) {\n  const words = currentPreviewWords;\n  if (!words || words.length === 0) { alert('目前沒有可匯出的詞彙！'); return; }\n\n  const PW = 2480, PH = 3508, MARGIN = 120, HEAD = 230, COLS = 7, GAP = 20;\n  const CW = Math.floor((PW - MARGIN * 2 - GAP * (COLS - 1)) / COLS);\n  const CH = 340;\n  const rows = Math.floor((PH - MARGIN - HEAD - MARGIN + GAP) / (CH + GAP));\n  const perPage = rows * COLS;\n  const pages = Math.ceil(words.length / perPage);\n  const WORD_FONT = '\"Microsoft JhengHei\",\"PingFang TC\",\"Noto Sans TC\",\"Heiti TC\",sans-serif';\n  const EMOJI_FONT = '\"Apple Color Emoji\",\"Segoe UI Emoji\",\"Noto Color Emoji\",sans-serif';\n  const modeName = showWord ? '含中文' : '空白練習版';\n\n  function roundRect(c, x, y, w, h, r) {\n    c.beginPath();\n    c.moveTo(x + r, y);\n    c.arcTo(x + w, y, x + w, y + h, r);\n    c.arcTo(x + w, y + h, x, y + h, r);\n    c.arcTo(x, y + h, x, y, r);\n    c.arcTo(x, y, x + w, y, r);\n    c.closePath();\n  }\n\n  const pageCanvases = [];\n  for (let p = 0; p < pages; p++) {\n    const c = document.createElement('canvas');\n    c.width = PW; c.height = PH;\n    const g = c.getContext('2d');\n    g.fillStyle = '#ffffff';\n    g.fillRect(0, 0, PW, PH);\n\n    // 標題\n    g.fillStyle = '#222';\n    g.textBaseline = 'alphabetic';\n    g.textAlign = 'left';\n    g.font = `900 80px ${WORD_FONT}`;\n    g.fillText(`詞彙預習卡片（${modeName}）`, MARGIN, MARGIN + 70);\n    g.font = `500 44px ${WORD_FONT}`;\n    g.fillStyle = '#666';\n    g.fillText(`共 ${words.length} 個詞彙　第 ${p + 1} / ${pages} 頁`, MARGIN, MARGIN + 140);\n    if (!showWord) {\n      g.textAlign = 'right';\n      g.fillText('姓名：____________　日期：____________', PW - MARGIN, MARGIN + 140);\n    }\n\n    const slice = words.slice(p * perPage, (p + 1) * perPage);\n    slice.forEach((w, i) => {\n      const col = i % COLS, row = Math.floor(i / COLS);\n      const x = MARGIN + col * (CW + GAP);\n      const y = HEAD + MARGIN + row * (CH + GAP);\n\n      g.lineWidth = 3;\n      g.strokeStyle = '#444';\n      roundRect(g, x, y, CW, CH, 18);\n      g.stroke();\n\n      // 類別\n      g.textAlign = 'left';\n      g.fillStyle = '#999';\n      g.font = `500 24px ${WORD_FONT}`;\n      g.fillText(w.category || '', x + 14, y + 36);\n\n      // 圖示\n      g.textAlign = 'center';\n      g.fillStyle = '#000';\n      g.font = `120px ${EMOJI_FONT}`;\n      g.fillText(w.emoji, x + CW / 2, y + 190);\n\n      if (showWord) {\n        let size = 52;\n        g.fillStyle = '#111';\n        do {\n          g.font = `900 ${size}px ${WORD_FONT}`;\n          size -= 2;\n        } while (g.measureText(w.word).width > CW - 24 && size > 20);\n        g.fillText(w.word, x + CW / 2, y + CH - 40);\n      } else {\n        // 書寫線\n        g.strokeStyle = '#888';\n        g.lineWidth = 2;\n        g.beginPath();\n        g.moveTo(x + 24, y + CH - 44);\n        g.lineTo(x + CW - 24, y + CH - 44);\n        g.stroke();\n      }\n    });\n\n    pageCanvases.push(c);\n  }\n  {\n    const pdfBlob = canvasesToPDF(pageCanvases);\n    const url = URL.createObjectURL(pdfBlob);\n    const a = document.createElement('a');\n    a.href = url; a.download = `詞彙預習卡片_${modeName}.pdf`;\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(url), 2000);\n    addLog('sys', `已匯出 PDF（${pages} 頁，${words.length} 個詞彙）`);\n  }\n}\n\n// 📄 純前端 PDF 產生器：每個 canvas 以 JPEG 嵌入一頁 A4（不需外部函式庫，中文與 emoji 不會亂碼）\nfunction canvasesToPDF(canvases) {\n  const enc = new TextEncoder();\n  const PWpt = 595.28, PHpt = 841.89;\n  const chunks = [];\n  const offsets = [];\n  let pos = 0;\n  const push = (d) => { const u = typeof d === 'string' ? enc.encode(d) : d; chunks.push(u); pos += u.length; };\n  const startObj = (id) => { offsets[id] = pos; push(`${id} 0 obj\\n`); };\n\n  const n = canvases.length;\n  // 物件編號：1 目錄、2 頁面樹、之後每頁 3 個物件（page, content, image）\n  push('%PDF-1.4\\n');\n  startObj(1); push('<< /Type /Catalog /Pages 2 0 R >>\\nendobj\\n');\n  const kids = [];\n  for (let i = 0; i < n; i++) kids.push(`${3 + i * 3} 0 R`);\n  startObj(2); push(`<< /Type /Pages /Kids [${ki
